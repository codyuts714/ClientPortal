/* ── IndexedDB: persist granted directory handles (not serializable to Firestore) ── */
function fsIdb(){ return new Promise((res,rej)=>{ const r=indexedDB.open("uts-fs-handles",1);
  r.onupgradeneeded=()=>r.result.createObjectStore("handles");
  r.onsuccess=()=>res(r.result); r.onerror=()=>rej(r.error); }); }
async function fsPutHandle(key,h){ const d=await fsIdb(); return new Promise((res,rej)=>{
  const tx=d.transaction("handles","readwrite"); tx.objectStore("handles").put(h,key);
  tx.oncomplete=()=>res(); tx.onerror=()=>rej(tx.error); }); }
async function fsGetHandle(key){ const d=await fsIdb(); return new Promise((res,rej)=>{
  const tx=d.transaction("handles","readonly"); const q=tx.objectStore("handles").get(key);
  q.onsuccess=()=>res(q.result||null); q.onerror=()=>rej(q.error); }); }
async function fsEnsurePerm(h,mode="readwrite"){ if(!h) return false; const o={mode};
  try{ if((await h.queryPermission(o))==="granted") return true;
       if((await h.requestPermission(o))==="granted") return true; }catch(e){}
  return false; }

let FSDEST=null;   /* destination directory handle chosen this session */
function fsEnsureLocked(){ if(!FSTRUCT.some(f=>f.locked)) FSTRUCT.unshift({name:"Raw Footage",on:true,locked:true}); }
function fsStructForProject(p){
  if(Array.isArray(p.folderStructurePreset)&&p.folderStructurePreset.length)
    return p.folderStructurePreset.map(f=>({name:f.name,on:f.on!==false,locked:!!f.locked}));

    ? (folderPresets.presets||[]).find(x=>x.name===folderPresets.defaultName) : null;
  if(def&&Array.isArray(def.folders)&&def.folders.length)
    return def.folders.map(f=>({name:f.name,on:f.on!==false,locked:!!f.locked}));
  return FS_DEFAULT_STRUCTURE.map(f=>({...f}));
}
function fsStructSync(){

/* ── create the tree on disk (idempotent — never overwrites) ── */
async function fsCreate(pid){
  const p=byId(projects,pid); if(!p) return;
  fsStructSync();
  const main=fsSanitize(document.getElementById("fs-main").value);
  if(!main) return toast("Give the main folder a name");
  const folders=[];
  for(const f of FSTRUCT){ if(f.on){ const n=fsSanitize(f.name); if(n&&!folders.includes(n)) folders.push(n); } }
  if(!folders.includes("Raw Footage")) folders.unshift("Raw Footage");
  const key="proj:"+pid;
  let dest=FSDEST||await fsGetHandle(key);
  if(dest&&!(await fsEnsurePerm(dest))) dest=null;
  if(!dest){
    try{ dest=await window.showDirectoryPicker({mode:"readwrite"}); }
    catch(e){ return; }                       /* user cancelled the picker */
    await fsPutHandle(key,dest);
  }
  const created=[], existed=[];
  try{
    const rootH=await dest.getDirectoryHandle(main,{create:true});
    for(const name of folders){
      let there=true;
      try{ await rootH.getDirectoryHandle(name); }catch(e){ there=false; }
      await rootH.getDirectoryHandle(name,{create:true});
      (there?existed:created).push(name);
    }
  }catch(e){ console.warn("fsCreate",e); return toast("Couldn't create folders — check drive access"); }
  const has=n=>folders.includes(n);
  const patch={
    folderStructurePreset:FSTRUCT.map(f=>({name:f.name,on:f.on!==false,locked:!!f.locked})),
    destinationHandleId:key,
    projectRootFolder:main,
    rawFolder:main+"/Raw Footage",
    exportsFolder: has("Exports")?main+"/Exports":(p.exportsFolder??null),
    premiereProjectFolder: has("Project Assets")?main+"/Project Assets":(p.premiereProjectFolder??null)
  };
  await guard(()=>updateDoc(doc(db,"projects",pid),patch));
  fsSuccess(pid, dest.name, main, created, existed);
}

/* ═══════════════════════════════════════════════════════════════
   CREATE PP PROJECT — reads Raw Footage, builds a Premiere-importable
   FCP7 (xmeml) XML: bins + a raw/stringout sequence with the footage
   placed end-to-end + one empty sequence per deliverable. A 15s
   adjustment layer sits on V3 of every DELIVERABLE (never the raw).
   ═══════════════════════════════════════════════════════════════ */

/* read every recognized file in the project's Raw Footage folder */
async function fsReadRaw(rootH){
  let raw; try{ raw=await rootH.getDirectoryHandle("Raw Footage"); }catch(e){ return []; }
  const out=[];
  for await(const [name,h] of raw.entries()){
    if(h.kind!=="file") continue;
    const ext=name.split(".").pop().toLowerCase();
    if(FS_MEDIA_EXT.includes(ext)) out.push({name,handle:h,ext});
  }
  return out;
}
/* probe duration + resolution via a hidden media element (best effort — HEVC/MXF may not read) */
function fsProbe(file,ext){ return new Promise(res=>{
  const isVid=FS_MEDIA_VID.includes(ext), isAud=FS_MEDIA_AUD.includes(ext);
  if(!isVid&&!isAud){ return res({dur:null,w:null,h:null,kind:"image"}); }
  const el=document.createElement(isVid?"video":"audio"); el.preload="metadata";
  const url=URL.createObjectURL(file); let done=false;
  const finish=o=>{ if(done)return; done=true; try{URL.revokeObjectURL(url);}catch(e){} res(o); };
  el.onloadedmetadata=()=>finish({dur:isFinite(el.duration)&&el.duration>0?el.duration:null,
    w:el.videoWidth||null,h:el.videoHeight||null,kind:isVid?"video":"audio"});
  el.onerror=()=>finish({dur:null,w:null,h:null,kind:isVid?"video":"audio"});
  setTimeout(()=>finish({dur:null,w:null,h:null,kind:isVid?"video":"audio"}),8000);
  el.src=url;
}); }

/* deliverables editor (mirrors the folder-structure editor) */
function fsDelivForProject(p){
  const saved=Array.isArray(p.deliverables)?p.deliverables:[];
  const byName={}; saved.forEach(d=>{ if(d&&d.name) byName[d.name.toLowerCase()]=d; });
  /* pull the deliverable titles straight from the project's pieces; keep any
     aspect/fps you set for a matching name last time */
  const pieces=(p.pieces||[]).map(x=>x&&x.name).filter(Boolean);
  if(pieces.length) return pieces.map(name=>{ const s=byName[name.toLowerCase()]||{};
    return {name, aspect:s.aspect||"9x16", fps:+s.fps||24}; });
  if(saved.length) return saved.map(d=>({name:d.name||"Reel",aspect:d.aspect||"9x16",fps:+d.fps||24}));
  return [{name:"Reel",aspect:"9x16",fps:24}];
}

async function fsBuild(pid){
  const p=byId(projects,pid); if(!p) return;
  fsDelivSync(); if(!PPDELIV.length) PPDELIV=[{name:"Reel",aspect:"9x16",fps:24}];
  const main=p.projectRootFolder; if(!main) return toast("Run Create Folders first");
  const basePath=(document.getElementById("pp-base")||{}).value||"";
  const adjOn=!!(document.getElementById("pp-adj")||{}).checked;
  const adjDur=+((document.getElementById("pp-adjdur")||{}).value)||15;
  const lutOn=!!(document.getElementById("pp-lut")||{}).checked;
  const key=p.destinationHandleId||("proj:"+pid);
  let dest=FSDEST||await fsGetHandle(key);
  if(dest&&!(await fsEnsurePerm(dest))) dest=null;
  if(!dest){ try{ dest=await window.showDirectoryPicker({mode:"readwrite"}); }catch(e){ return; } await fsPutHandle(key,dest); }
  let rootH; try{ rootH=await dest.getDirectoryHandle(main); }
  catch(e){ return toast(`Can't find "${main}" on this drive — run Create Folders first`); }
  toast("Reading Raw Footage…");
  const raw=await fsReadRaw(rootH);
  const clips=[];
  for(const it of raw){
    let meta={dur:null,w:null,h:null,kind:FS_MEDIA_VID.includes(it.ext)?"video":FS_MEDIA_AUD.includes(it.ext)?"audio":"image"};
    try{ meta=await fsProbe(await it.handle.getFile(), it.ext); }catch(e){}
    clips.push({name:it.name,ext:it.ext,...meta});
  }
  clips.sort((a,b)=>a.name.localeCompare(b.name,undefined,{numeric:true}));
  const {xml,flagged}=fsBuildXml(p,main,clips,PPDELIV,{basePath,adjOn,adjDur,lutOn});
  const xmlName=fsSanitize(main)+".xml";
  try{ const fh=await rootH.getFileHandle(xmlName,{create:true});
    const w=await fh.createWritable(); await w.write(xml); await w.close(); }
  catch(e){ console.warn("fsBuild write",e); return toast("Couldn't write the .xml"); }
  await guard(()=>updateDoc(doc(db,"projects",pid),{
    deliverables:PPDELIV.map(d=>({name:d.name,aspect:d.aspect,fps:d.fps})),
    ppBasePath:basePath||null, ppAdjLayer:{on:adjOn,dur:adjDur,lut:lutOn},
    premiereXmlPath:main+"/"+xmlName, mediaFileCount:clips.length }));
  if(basePath && p.driveId){ try{ await updateDoc(doc(db,"drives",p.driveId),{basePath}); }catch(e){} }
  fsBuildDone(pid,xmlName,clips.filter(c=>c.kind!=="audio").length,flagged,adjOn,lutOn);
}

/* the generator — returns {xml, flagged[]} */
function fsBuildXml(p,main,clips,deliverables,opt){
  const xe=s=>String(s==null?"":s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");
  const NOMINAL=10, flagged=[];
  const firstVid=clips.find(c=>c.kind==="video"&&c.w&&c.h);
  const srcW=firstVid?firstVid.w:3840, srcH=firstVid?firstVid.h:2160;
  const rr=fsRate(24);   /* raw stringout: source spec unknown in-browser → sensible default 24 */
  /* place video + image clips end-to-end on V1 */
  let pos=0, fileSeq=0; const seen={}, items=[];
  clips.forEach((c,i)=>{
    if(c.kind==="audio") return;
    const secs=c.dur||(c.kind==="image"?5:NOMINAL);
    if(!c.dur&&c.kind!=="image") flagged.push(`${c.name} → ${secs}s`);
    const frames=Math.max(1,Math.round(secs*rr.tb));
    const start=pos, end=pos+frames; pos=end;
    let fileBlock;
    if(seen[c.name]) fileBlock=`<file id="${seen[c.name]}"/>`;
    else{ const fid="file-"+(++fileSeq); seen[c.name]=fid;
      const pathurl=opt.basePath
        ? `<pathurl>file://localhost/${xe(encodeURI(opt.basePath.replace(/\\/g,"/").replace(/\/+$/,"")+"/"+main+"/Raw Footage/"+c.name))}</pathurl>` : "";
      const media=(c.w&&c.h)
        ? `<media><video><samplecharacteristics><width>${c.w}</width><height>${c.h}</height></samplecharacteristics></video><audio><channelcount>2</channelcount></audio></media>`
        : `<media><audio><channelcount>2</channelcount></audio></media>`;
      fileBlock=`<file id="${fid}"><name>${xe(c.name)}</name>${pathurl}${rr.xml}<duration>${frames}</duration>${media}</file>`;
    }
    items.push(`<clipitem id="clipitem-${i+1}"><name>${xe(c.name)}</name><duration>${frames}</duration>${rr.xml}<start>${start}</start><end>${end}</end><in>0</in><out>${frames}</out>${fileBlock}</clipitem>`);
  });
  const rawSeq=`<sequence id="sequence-raw"><name>RAW — Stringout</name><duration>${pos}</duration>${rr.xml}<media><video><format><samplecharacteristics>${rr.xml}<width>${srcW}</width><height>${srcH}</height><anamorphic>FALSE</anamorphic><pixelaspectratio>square</pixelaspectratio><fielddominance>none</fielddominance></samplecharacteristics></format><track>${items.join("")}</track></video><audio><format><samplecharacteristics><depth>16</depth><samplerate>48000</samplerate></samplecharacteristics></format><track></track><track></track></audio></media><timecode>${rr.xml}<string>00:00:00:00</string><frame>0</frame><displayformat>NDF</displayformat></timecode></sequence>`;

  const delivSeqs=deliverables.map((d,i)=>{
    const a=FS_ASPECTS[d.aspect]||FS_ASPECTS["9x16"], dr=fsRate(d.fps);
    let v3="";
    if(opt.adjOn){ const f=Math.max(1,Math.round((opt.adjDur||15)*dr.tb));
      const tmpl=opt.lutOn?fsAdjClipTemplate():null;
      if(tmpl){ /* real Premiere adjustment-layer + embedded LUT, spliced verbatim */
        const clip=tmpl.replace(/__CID__/g,`clipitem-adj-${i+1}`).replace(/__MID__/g,`masterclip-adj-${i+1}`)
          .replace(/__FID__/g,`file-adj-${i+1}`).replace(/__FR__/g,String(f))
          .replace(/__W__/g,String(a.w)).replace(/__H__/g,String(a.h));
        v3=`<track>${clip}</track>`;
      } else { /* adjustment layer without the LUT — plain slug marking V3 */
        v3=`<track><clipitem id="adj-${i+1}"><name>Adjustment Layer</name><duration>${f}</duration>${dr.xml}<start>0</start><end>${f}</end><in>0</in><out>${f}</out><file id="adjfile-${i+1}"><name>Adjustment Layer</name>${dr.xml}<media><video><samplecharacteristics>${dr.xml}<width>${a.w}</width><height>${a.h}</height></samplecharacteristics></video></media></file></clipitem></track>`; }
    }
    const vtracks=opt.adjOn?`<track></track><track></track>${v3}`:`<track></track>`;
    return `<sequence id="sequence-deliv-${i+1}"><name>${xe(d.name||("Deliverable "+(i+1)))}</name><duration>0</duration>${dr.xml}<media><video><format><samplecharacteristics>${dr.xml}<width>${a.w}</width><height>${a.h}</height><anamorphic>FALSE</anamorphic><pixelaspectratio>square</pixelaspectratio><fielddominance>none</fielddominance></samplecharacteristics></format>${vtracks}</video><audio><format><samplecharacteristics><depth>16</depth><samplerate>48000</samplerate></samplecharacteristics></format><track></track><track></track></audio></media><timecode>${dr.xml}<string>00:00:00:00</string><frame>0</frame><displayformat>NDF</displayformat></timecode></sequence>`;
  }).join("");

  const binNames=Array.isArray(p.folderStructurePreset)
    ? p.folderStructurePreset.filter(f=>f.on!==false).map(f=>f.name)
    : ["Raw Footage","Photos","Project Assets","Exports"];
  const bins=binNames.map(n=>`<bin><name>${xe(n)}</name><children/></bin>`).join("");

  const xml=`<?xml version="1.0" encoding="UTF-8"?>
<!DOCTYPE xmeml>
<xmeml version="4">
  <project>
    <name>${xe(main)}</name>
    <children>
      ${bins}
      ${rawSeq}
      ${delivSeqs}
    </children>
  </project>
</xmeml>`;
  return {xml,flagged};
}

function fsBuildDone(pid,xmlName,count,flagged,adjOn,lutOn){
  showModal(`<h3>Premiere project built</h3>
    <p style="font-size:13px;color:var(--cream)"><b>${esc(xmlName)}</b> is in your project folder. In Premiere: <b>File → Import</b> and pick it.</p>
    <div class="hint">${count} clip${count===1?"":"s"} placed on <b>RAW — Stringout</b>. Each deliverable is its own empty sequence${adjOn?(lutOn?" with your adjustment layer + LUT on V3":" with a plain adjustment layer on V3"):""}.</div>
    ${flagged.length?`<div class="hint" style="color:var(--gold-soft)">No duration read (placed at nominal length, not dropped): ${flagged.slice(0,10).map(esc).join(", ")}${flagged.length>10?` +${flagged.length-10} more`:""}</div>`:""}
    ${adjOn&&lutOn?`<div class="hint">The LUT is embedded in the Lumetri data, so it travels with the XML — confirm it lands right on your first import.</div>`:""}
    <div class="modal-actions"><button class="btn ghost" data-close="1">DONE</button></div>`);
}

/* ── scoped click handling for the folder feature (own listener, like the rest of the app) ── */
document.addEventListener("click",e=>{
  const t=e.target.closest("[data-fs-folders],[data-fs-pp],[data-fs-add],[data-fs-del],[data-fs-load],[data-fs-savepreset],[data-fs-default],[data-fs-create],[data-fs-linkdrive],[data-fs-dest],[data-fs-deliv-add],[data-fs-deliv-del],[data-fs-build]");
  if(!t) return;
  const d=t.dataset;
  if(d.fsFolders!==undefined) return fsFolderModal(d.fsFolders);
  if(d.fsPp!==undefined) return fsPPModal(d.fsPp);
  if(d.fsAdd!==undefined){ fsStructSync(); FSTRUCT.push({name:"",on:true}); return fsStructRender(); }
  if(d.fsDel!==undefined){ fsStructSync(); FSTRUCT.splice(+d.fsDel,1); fsEnsureLocked(); return fsStructRender(); }
  if(d.fsDelivAdd!==undefined){ fsDelivSync(); PPDELIV.push({name:"Reel",aspect:"9x16",fps:24}); return fsDelivRender(); }
  if(d.fsDelivDel!==undefined){ fsDelivSync(); PPDELIV.splice(+d.fsDelivDel,1); if(!PPDELIV.length) PPDELIV.push({name:"Reel",aspect:"9x16",fps:24}); return fsDelivRender(); }
  if(d.fsBuild!==undefined) return fsBuild(d.fsBuild);
  if(d.fsLoad!==undefined) return fsLoadPreset();
  if(d.fsSavepreset!==undefined) return fsSavePreset();
  if(d.fsDefault!==undefined) return fsSetDefaultPreset();
  if(d.fsCreate!==undefined) return fsCreate(d.fsCreate);
  if(d.fsLinkdrive!==undefined) return fsLinkDrive(d.fsLinkdrive);
  if(d.fsDest!==undefined) return fsChooseDest(d.fsDest);
});

/* ── boot ── */
onAuthStateChanged(auth,u=>{
  authUser=u;
  if(u){ booting=true; paint(); loadFor(u); }
  else { me=null; booting=false; stopAll();
         clients=[];projects=[];invoices=[];payables=[];activity=[];users=[];drives=[]; paint(); }
});

if("serviceWorker" in navigator){
  let _swReloading=false;
  navigator.serviceWorker.addEventListener("controllerchange",()=>{ if(_swReloading) return; _swReloading=true; location.reload(); });
  window.addEventListener("load",async()=>{ try{ const reg=await navigator.serviceWorker.register("sw.js"); reg.update(); }catch(e){} });
}
})();
