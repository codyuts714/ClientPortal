/* ---------- cloud ---------- */
function initFirebase(){
  if(!FB_CONFIG.projectId||typeof firebase==='undefined'){
    // offline mode: owner view unless the link says client
    CLIENT=FORCE_CLIENT; return;
  }
  firebase.initializeApp(FB_CONFIG);
  auth=firebase.auth(); db=firebase.firestore();
  auth.onAuthStateChanged(async u=>{
    USER=u;
    const owner=!!u && (!OWNER_EMAIL || u.email===OWNER_EMAIL);
    CLIENT=FORCE_CLIENT || !owner;
    if(u && !owner) toast('That account is not the studio owner');
    await loadCloud();
    applyView(); render();
  });
  loadCloud().then(()=>{ applyView(); render(); });
}
function toggleAuth(){
  if(!auth){ toast('Add your Firebase config to enable sign in'); return; }
  if(USER){ auth.signOut(); return; }
  auth.signInWithPopup(new firebase.auth.GoogleAuthProvider())
    .catch(e=>toast('Sign in failed'));
}
/* public doc = menu + starred packages, NO costs. private doc = costs only. */
async function loadCloud(){
  if(!db) return;
  try{
    const pub=await db.doc('quoteBuilder/public').get();
    if(pub.exists){
      const d=pub.data();
      if(d.catalog) S.catalog=d.catalog;
      if(d.packages) S.packages=d.packages;
      if(d.terms) S.terms=d.terms;
    }
    if(!CLIENT){
      const priv=await db.doc('quoteBuilder/private').get();
      if(priv.exists){
        const costs=priv.data().costs||{};
        S.catalog.forEach(s=>{ if(costs[s.id]!=null) s.cost=costs[s.id]; });
        S.packages.forEach(p=>p.lines.forEach(l=>{ if(l.src&&costs[l.src]!=null) l.cost=costs[l.src]; }));
      }
    }
    fill();
  }catch(e){ console.warn('cloud load',e); }
}
async function saveCloud(){
  if(!db||!USER) return toast('Sign in first');
  const strip=a=>a.map(({cost,...r})=>r);
  const costs={}; S.catalog.forEach(s=>costs[s.id]=s.cost||0);
  try{
    await db.doc('quoteBuilder/public').set({
      catalog:strip(S.catalog),
      packages:S.packages.map(p=>({...p,lines:strip(p.lines)})),
      terms:S.terms, updatedAt:new Date().toISOString()
    });
    await db.doc('quoteBuilder/private').set({costs,updatedAt:new Date().toISOString()});
    toast('Saved to cloud');
  }catch(e){ toast('Save failed — check rules'); console.warn(e); }
}

function upSvc(id,k,v){ const s=S.catalog.find(x=>x.id===id); if(!s)return; s[k]=v;

  renderTotals(); }
function upMode(id,m,on){ const s=S.catalog.find(x=>x.id===id); if(!s)return;
  s.modes=on?[...new Set([...s.modes,m])]:s.modes.filter(x=>x!==m); render(); }
function addService(){
  const name=document.getElementById('ns').value.trim();
  const rate=parseFloat(document.getElementById('nr').value);
  if(!name||isNaN(rate)) return toast('Name and rate are required');
  const modes=[];
  if(mf.checked)modes.push('full'); if(mh.checked)modes.push('shoot'); if(me.checked)modes.push('edit');
  S.catalog.push({id:uid(),name,cat:nc.value.trim()||'Other',desc:nd.value.trim(),rate,
    cost:num(document.getElementById('nk').value),unit:nu.value,modes:modes.length?modes:['full']});
  ['ns','nc','nd','nr','nk'].forEach(i=>document.getElementById(i).value='');

}
function delService(id){ if(!confirm('Remove this from the menu?'))return;
  S.catalog=S.catalog.filter(s=>s.id!==id); editingSvc=null; render(); }

/* ---- lines ---- */
function addLine(s){
  const hit=S.lines.find(l=>l.src===s.id);
  if(hit) hit.qty++;
  else S.lines.push({id:uid(),src:s.id,name:s.name,desc:s.desc,rate:s.rate,cost:s.cost||0,
    unit:s.unit,qty:1,optional:false,on:true,modes:s.modes});
  render();
}
function addCustomLine(){
  S.lines.push({id:uid(),src:null,name:'Custom line item',desc:'',rate:0,cost:0,unit:'project',
    qty:1,optional:false,on:true,modes:['full','shoot','edit']});
  render();
}
function setQty(id,v){ const l=S.lines.find(x=>x.id===id); if(!l)return;
  l.qty=Math.max(0,num(v)); if(!l.qty) S.lines=S.lines.filter(x=>x.id!==id); render(); }
function bump(id,d){ const l=S.lines.find(x=>x.id===id); if(l) setQty(id,l.qty+d); }
function upLine(id,k,v){ const l=S.lines.find(x=>x.id===id); if(!l)return;
  l[k]=(k==='rate'||k==='cost')?num(v):v; renderTotals(); }
function toggleOpt(id){ const l=S.lines.find(x=>x.id===id); l.optional=!l.optional; if(!l.optional)l.on=true; render(); }
function toggleOn(id){ const l=S.lines.find(x=>x.id===id); l.on=!l.on; render(); }
function rmLine(id){ S.lines=S.lines.filter(x=>x.id!==id); render(); }

/* ---- rights ---- */
function fillRights(){
  const set=(el,arr,sel)=>{el.innerHTML=arr.map(o=>`<option value="${o.id}" ${o.id===sel?'selected':''}>${o.name}</option>`).join('')};
  set(rScope,RIGHTS_SCOPE,S.rights.scope); set(rTerm,RIGHTS_TERM,S.rights.term); set(rTerr,RIGHTS_TERR,S.rights.terr);
}
function rightsFrom(r,base){
  const sc=RIGHTS_SCOPE.find(o=>o.id===r.scope)||RIGHTS_SCOPE[0];
  const tm=RIGHTS_TERM.find(o=>o.id===r.term)||RIGHTS_TERM[2];
  const tr=RIGHTS_TERR.find(o=>o.id===r.terr)||RIGHTS_TERR[0];
  const pct=sc.pct*tm.m*tr.m;
  return {amt:base*pct,pct,label:`${sc.name} · ${tm.name} · ${tr.name}`};
}

/* ---- client-facing offers (featured saved packages) ---- */
function pkgSub(p){ return p.lines.filter(l=>l.on).reduce((a,l)=>a+l.rate*l.qty,0); }
function pkgTotal(p){ const s=pkgSub(p); return p.pkgRate!=null?p.pkgRate:s+rightsFrom(p.rights,s).amt; }
function pkgCost(p){ return p.lines.filter(l=>l.on).reduce((a,l)=>a+(l.cost||0)*l.qty,0); }
function featured(){ return S.packages.filter(p=>p.featured).sort((a,b)=>pkgTotal(a)-pkgTotal(b)); }
function toggleFeatured(id){
  const p=S.packages.find(x=>x.id===id); if(!p) return;
  if(!p.featured && featured().length>=3) return toast('Three offers is the limit — unstar one first');
  p.featured=!p.featured; render();
}
function choosePkg(id){
  const p=S.packages.find(x=>x.id===id); if(!p)return;
  S.lines=JSON.parse(JSON.stringify(p.lines)); S.mode=p.mode; S.rights={...p.rights}; S.pkgRate=p.pkgRate;
  S.chosenPkg=id; S.custom=false;
  document.getElementById('pkgrate').value=p.pkgRate??'';
  fillRights(); render();
}
/* any edit to a chosen package's line-up drops it to custom pricing */
function checkCustom(){
  if(!S.chosenPkg) return;
  const p=S.packages.find(x=>x.id===S.chosenPkg);
  if(!p) { S.chosenPkg=null; return; }
  const sig=a=>a.filter(l=>l.on).map(l=>l.name+'|'+l.qty+'|'+l.rate).sort().join(';');
  if(sig(p.lines)!==sig(S.lines)){
    S.custom=true; S.pkgRate=null;
    const el=document.getElementById('pkgrate'); if(el) el.value='';
  } else S.custom=false;
}
function renderOffers(){
  const live=featured();
  const panel=document.getElementById('offerPanel');
  const show=CLIENT?live.length>0:(tab==='packages'&&live.length>0)||live.length>1;
  panel.style.display=show?'':'none';
  if(show){
    document.getElementById('offerCards').innerHTML=live.map((p,i)=>{
      const on=p.lines.filter(l=>l.on);
      const items=on.slice(0,6).map(l=>`<li>${l.qty>1?l.qty+'× ':''}${esc(l.name)}</li>`).join('');
      const more=on.length-6;
      const tot=pkgTotal(p), c=pkgCost(p), m=tot?1-c/tot:0;
      const listVal=pkgSub(p)+rightsFrom(p.rights,pkgSub(p)).amt;
      return `<div class="tier ${S.chosenPkg===p.id&&!S.custom?'on':''}" onclick="choosePkg('${p.id}')">
        ${i===1&&live.length>2?'<div class="badge">Most chosen</div>':''}
        <div class="tl">${(MODES.find(x=>x.id===p.mode)||MODES[0]).name}</div>
        <div class="tn">${esc(p.name)}</div>
        <div class="tp">${money(tot)}</div>
        ${listVal>tot?`<div class="tm" style="color:var(--green)">${money(listVal-tot)} under à la carte</div>`:''}
        ${CLIENT?'':`<div class="tm" style="color:${marginColor(m)}">${Math.round(m*100)}% margin · ${money(tot-c)} profit</div>`}
        <ul>${items}${more>0?`<li>+ ${more} more</li>`:''}</ul>
      </div>`;
    }).join('');
    const flag=document.getElementById('customFlag');
    if(S.custom||(!S.chosenPkg&&S.lines.length)){
      const cheapest=live.length?Math.min(...live.map(pkgTotal)):0;
      flag.innerHTML=`<div class="empty" style="margin-top:12px;text-align:left;border-color:var(--line);color:var(--text)">
        <b style="font-family:'Rajdhani';letter-spacing:.08em;text-transform:uppercase">Custom build</b><br>
        <span class="note">Built-to-order packages price à la carte — every line at full rate.
        ${cheapest?`Our set packages start at ${money(cheapest)} and come in under itemized value.`:''}</span></div>`;
    } else flag.innerHTML='';
  }
}

/* ---- saved packages ---- */
function savePackage(){
  if(!S.lines.length) return toast('Nothing to save');
  const name=(prompt('Name this package — this is what clients see','')||'').trim();
  if(!name) return toast('A package needs a name');
  const id=uid();
  S.packages.push({id,name,featured:featured().length<3,mode:S.mode,
    lines:JSON.parse(JSON.stringify(S.lines)),rights:{...S.rights},pkgRate:S.pkgRate});
  S.chosenPkg=id; S.custom=false;
  render(); toast('Saved — '+name);
}
function updatePackage(id){

  p.lines=JSON.parse(JSON.stringify(S.lines)); p.mode=S.mode; p.rights={...S.rights}; p.pkgRate=S.pkgRate;

function renamePackage(id){ const p=S.packages.find(x=>x.id===id); if(!p)return;

function delPackage(id){ S.packages=S.packages.filter(p=>p.id!==id); render(); }

/* ---- totals ---- */
function renderTotals(){
  const pr=parseFloat(document.getElementById('pkgrate').value);
  S.pkgRate=isNaN(pr)?null:pr;
  S.rights={scope:rScope.value,term:rTerm.value,terr:rTerr.value};

  const active=S.lines.filter(l=>l.on);
  const sub=active.reduce((a,l)=>a+l.rate*l.qty,0);
  const r=rightsFrom(S.rights,sub);
  const listTotal=sub+r.amt;
  const total=S.pkgRate!=null?S.pkgRate:listTotal;
  const cost=active.reduce((a,l)=>a+(l.cost||0)*l.qty,0);
  const profit=total-cost, m=total?profit/total:0;

  tsub.textContent=money(sub);
  trights.textContent=r.amt?money(r.amt):'Included';
  rRow.style.display=sub?'':'none';
  rNote.textContent=r.pct?`${r.label} — licensed use adds ${Math.round(r.pct*100)}% to the creative fee.`
    :`${r.label} — no added fee. Running these as paid ads later needs an expanded license.`;
  tlistval.textContent=money(listTotal);
  ttotal.textContent=money(total);
  tdep.textContent=money(total/2);
  tfin.textContent=money(total/2);
  const save=listTotal-total;
  savings.textContent=save>0?`Package rate — ${money(save)} under itemized value`:'';

  if(!CLIENT){
    mcost.textContent=money(cost);
    mprofit.textContent=money(profit);
    mprofit.style.color=marginColor(m);
    mpct.textContent=total?Math.round(m*100)+'%':'—';
    mpct.style.color=marginColor(m);
    const bar=document.getElementById('mbar');
    bar.style.width=Math.max(0,Math.min(100,m*100))+'%';
    bar.style.background=marginColor(m);
    mnote.textContent=!total?'Add services to see margin.'
      :m<.35?'Thin. Raise the package rate or trim what you are subbing out.'
      :m<.55?'Workable. Watch the sub-contracted lines.'
      :'Healthy margin on this package.';
  }

  const c=S.client;
  qtitle.textContent=c.proj||(c.name?c.name+' — Package':'Package');
  let expTxt='';
  if(c.exp){
    const d=new Date(c.exp+'T12:00');
    const days=Math.ceil((d-new Date())/864e5);
    expTxt=(days<0?'Expired ':'Expires ')+d.toLocaleDateString('en-US',{month:'short',day:'numeric'})
      +(days>=0&&days<=5?` (${days} day${days===1?'':'s'} left)`:'');
  }
  qmeta.textContent=[c.name,c.num,expTxt].filter(Boolean).join('  ·  ');
  const chosen=S.chosenPkg&&!S.custom?S.packages.find(p=>p.id===S.chosenPkg):null;
  document.getElementById('phTitle').textContent=chosen?chosen.name:(c.proj||'Package Quote');
  document.getElementById('phMeta').textContent=[c.name,c.num,expTxt].filter(Boolean).join(' · ');

  /* embedded in the portal there's no addressable URL — don't blow up */
  if(!CLIENT) try{ history.replaceState(null,'','#'+encodeState()); }catch(e){}
  const gate=document.getElementById('customGate');
  if(gate) gate.style.display=(CLIENT&&featured().length&&!customOpen)?'':'none';
  if(CLIENT&&featured().length&&!customOpen){ const c=document.getElementById('catalogPanel'); if(c) c.style.display='none'; }
}
function render(){
  checkCustom(); renderModes(); renderCatalog(); renderCatalogEditor(); renderLines(); renderOffers(); renderPackages(); renderTotals();
}
function sync(){
  S.client={name:cname.value,proj:cproj.value,num:cnum.value,exp:cexp.value};
  S.terms=terms.value; renderTotals();
}

/* ---- actions ---- */
function toast(m){ try{ const t=document.getElementById('toast'); if(!t) return;
  t.textContent=m; t.classList.add('on'); setTimeout(()=>t.classList.remove('on'),1900); }catch(e){} }
function clientURL(){ return location.origin+location.pathname+'?mode=client#'+encodeState(clientState()); }
function publicURL(){ return location.origin+location.pathname; }
function copyPublicLink(){ navigator.clipboard.writeText(publicURL()).then(()=>toast('Public link copied'),()=>toast('Copy failed')); }
function copyClientLink(){ navigator.clipboard.writeText(clientURL()).then(()=>toast('Client link copied — no costs in it'),()=>toast('Copy failed')); }
function quoteTotal(){
  const sub=S.lines.filter(l=>l.on).reduce((a,l)=>a+l.rate*l.qty,0);
  return S.pkgRate!=null?S.pkgRate:sub+rightsFrom(S.rights,sub).amt;
}
function quoteCost(){ return S.lines.filter(l=>l.on).reduce((a,l)=>a+(l.cost||0)*l.qty,0); }
function copySummary(){
  const active=S.lines.filter(l=>l.on), tot=quoteTotal();
  const sub=active.reduce((a,l)=>a+l.rate*l.qty,0);
  const txt=[
    `UNDER THE SUN STUDIOS — ${S.client.proj||'Package Quote'}`,
    S.client.name?`Client: ${S.client.name}`:'',
    `Quote ${S.client.num}${S.client.exp?' · expires '+S.client.exp:''}`,
    `Scope: ${(MODES.find(m=>m.id===S.mode)||MODES[0]).name}`,'',
    ...active.map(l=>`• ${l.qty>1?l.qty+'× ':''}${l.name}${l.optional?' (optional)':''}`),'',
    `Usage: ${rightsFrom(S.rights,sub).label}`,
    `PACKAGE RATE ${money(tot)}`,
    `Deposit to book ${money(tot/2)} · Final on delivery ${money(tot/2)}`,'',
    S.terms
  ].filter(Boolean).join('\n');
  navigator.clipboard.writeText(txt).then(()=>toast('Quote copied'),()=>toast('Copy failed'));
}

function leadPayload(extra){
  const sub=S.lines.filter(l=>l.on).reduce((a,l)=>a+l.rate*l.qty,0);
  const tot=quoteTotal(), cost=quoteCost();
  return Object.assign({
    source:CLIENT?'client-built-quote':'quote-builder',
    pipeline:'lead', leadStage:'proposal',
    name:S.client.name||'Unnamed lead',
    project:S.client.proj||'',
    quoteNumber:S.client.num,
    scope:(MODES.find(m=>m.id===S.mode)||MODES[0]).name,
    package:(S.chosenPkg&&!S.custom&&(S.packages.find(p=>p.id===S.chosenPkg)||{}).name)||'Custom build',
    value:tot, deposit:tot/2, cost, profit:tot-cost,
    margin:tot?Math.round((1-cost/tot)*100):0,
    usage:rightsFrom(S.rights,sub).label,
    expires:S.client.exp,
    quotedAt:new Date().toISOString(),
    followUpBy:new Date(Date.now()+2*864e5).toISOString().slice(0,10),
    deliverables:S.lines.filter(l=>l.on).map(l=>({name:l.name,qty:l.qty,unit:l.unit,rate:l.rate,optional:l.optional})),
    quoteLink:clientURL()
  },extra||{});
}
// Studio Brain hook: define window.UTS_PUSH_LEAD(payload) in the portal and these write straight to the board.
function sendToInbound(){
  const p=leadPayload();
  if(typeof window.UTS_PUSH_LEAD==='function'){
    Promise.resolve(window.UTS_PUSH_LEAD(p)).then(()=>toast('Sent to inbound board'),()=>toast('Push failed — copied instead'));
    return;
  }
  navigator.clipboard.writeText(JSON.stringify(p,null,2)).then(()=>toast('Lead JSON copied for the board'),()=>toast('Copy failed'));
}
function submitRequest(){
  const name=lname.value.trim();
  if(!name) return toast('Add your name so we know who this is');
  const p=leadPayload({name,email:lmail.value.trim(),phone:lphone.value.trim(),notes:lnote.value.trim(),leadStage:'lead'});
  delete p.cost; delete p.profit; delete p.margin;
  if(typeof window.UTS_PUSH_LEAD==='function'){
    Promise.resolve(window.UTS_PUSH_LEAD(p)).then(()=>toast('Sent — Cody will be in touch'),()=>mailFallback(p));
    return;
  }
  mailFallback(p);
}
function mailFallback(p){
  const body=encodeURIComponent(
    `${p.name} put together a package.\n\nScope: ${p.scope}\nTotal: ${money(p.value)}\nUsage: ${p.usage}\n\n`+
    p.deliverables.map(d=>`• ${d.qty>1?d.qty+'× ':''}${d.name}`).join('\n')+
    `\n\nNotes: ${p.notes||'—'}\nEmail: ${p.email||'—'}  Phone: ${p.phone||'—'}\n\nLink: ${p.quoteLink}`);
  location.href=`mailto:cody@underthesunstudios.com?subject=${encodeURIComponent('New package request — '+p.name)}&body=${body}`;
}

function exportJSON(){
  const b=new Blob([JSON.stringify(S,null,2)],{type:'application/json'});
  const a=document.createElement('a'); a.href=URL.createObjectURL(b);
  a.download=(S.client.num||'uts-quote')+'.json'; a.click(); toast('Exported');
}
function importJSON(e){
  const f=e.target.files[0]; if(!f)return;
  const r=new FileReader();
  r.onload=()=>{ try{ S=Object.assign(S,JSON.parse(r.result)); fill(); fillRights(); render(); toast('Loaded'); }
    catch(x){ toast('That file could not be read'); } };
  r.readAsText(f); e.target.value='';
}
function resetQuote(){
  S.lines=[]; S.pkgRate=null; S.chosenPkg=null; S.custom=false;
  S.client={name:'',proj:'',num:'UTS-'+new Date().toISOString().slice(2,10).replace(/-/g,''),exp:defaultExp()};
  fill(); render();
}
function fill(){
  cname.value=S.client.name||''; cproj.value=S.client.proj||'';
  cnum.value=S.client.num||''; cexp.value=S.client.exp||'';
  terms.value=S.terms||''; document.getElementById('pkgrate').value=S.pkgRate??'';
}
fill(); fillRights(); setTab('build');
<\/script>
</body>
</html>

   (APIs & Services → Credentials), enable the Google Calendar API, add
   your site to "Authorized JavaScript origins", then paste the ID below.
   Leave it "" and the calendar still works with your own shoots/edits. */
const GCAL_CLIENT_ID = "";
let gcalToken=null, gcalEvents=[], gcalTokenClient=null;
const gcalConfigured=()=>!!GCAL_CLIENT_ID;
const gcalOn=iso=>gcalEvents.filter(e=>e.iso===iso);
function loadGIS(){
  return new Promise((res,rej)=>{
    if(window.google&&google.accounts&&google.accounts.oauth2) return res();
    const s=document.createElement("script");
    s.src="https://accounts.google.com/gsi/client"; s.async=true; s.defer=true;
    s.onload=()=>res(); s.onerror=()=>rej(new Error("gis"));
    document.head.appendChild(s);
  });
}
async function connectGCal(){
  if(!gcalConfigured()) return toast("Add your Google client ID in the file to enable");
  try{ await loadGIS(); }catch(e){ return toast("Couldn't reach Google"); }
  gcalTokenClient=gcalTokenClient||google.accounts.oauth2.initTokenClient({
    client_id:GCAL_CLIENT_ID,
    scope:"https://www.googleapis.com/auth/calendar.events.readonly",
    callback:r=>{ if(r&&r.access_token){ gcalToken=r.access_token; fetchGCal(); } }
  });
  gcalTokenClient.requestAccessToken({prompt:gcalToken?"":"consent"});
}
async function fetchGCal(){
  if(!gcalToken) return;
  const now=new Date(); now.setHours(0,0,0,0);
  const end=new Date(now); end.setDate(end.getDate()+14);
  const url="https://www.googleapis.com/calendar/v3/calendars/primary/events"
    +"?singleEvents=true&orderBy=startTime&maxResults=100"
    +"&timeMin="+encodeURIComponent(now.toISOString())
    +"&timeMax="+encodeURIComponent(end.toISOString());
  try{
    const r=await fetch(url,{headers:{Authorization:"Bearer "+gcalToken}});
    if(!r.ok) throw 0;
    const j=await r.json();
    gcalEvents=(j.items||[]).map(ev=>({
      iso:(ev.start&&(ev.start.date||ev.start.dateTime)||"").slice(0,10),
      title:ev.summary||"(busy)"
    })).filter(e=>e.iso);
    toast("Google Calendar synced"); paint();
  }catch(e){ gcalToken=null; toast("Calendar sync failed — reconnect"); }
}
document.addEventListener("click",e=>{
  const g=e.target.closest("[data-gcal]"); if(!g) return;
  if(g.dataset.gcal==="refresh"&&gcalToken) fetchGCal(); else connectGCal();
});

/* SVG donut ("data wheel") with a % in the middle — colour warms as it fills */
function donut(pctv,size){
  size=size||96; const sw=Math.round(size*0.11), r=(size-sw)/2, c=size/2, C=2*Math.PI*r;
  pctv=Math.max(0,Math.min(100,Math.round(pctv)));
  const col=pctv>=90?T.red:pctv>=75?T.gold:T.green;
  const off=C*(1-pctv/100);
  return `<svg class="dwheel" width="${size}" height="${size}" viewBox="0 0 ${size} ${size}" aria-label="${pctv}% full">
    <circle cx="${c}" cy="${c}" r="${r}" fill="none" stroke="${T.line}" stroke-width="${sw}"/>
    <circle cx="${c}" cy="${c}" r="${r}" fill="none" stroke="${col}" stroke-width="${sw}" stroke-linecap="round"
      stroke-dasharray="${C.toFixed(1)}" stroke-dashoffset="${off.toFixed(1)}"
      transform="rotate(-90 ${c} ${c})" style="transition:stroke-dashoffset .5s ease"/>
    <text class="pctnum" x="${c}" y="${c}" text-anchor="middle" dominant-baseline="central"
      fill="${col}" style="font-size:${Math.round(size*0.26)}px">${pctv}<tspan style="font-size:${Math.round(size*0.15)}px">%</tspan></text>
  </svg>`;
}

function basePct(p){
  const st=+p.stage||0;
  if(st>=4) return 100;                 /* only Delivered reads 100% */
  if(st<2)  return st===0?5:15;
  const list=p.pieces||[];
  if(!list.length) return 15;
  const s=list.reduce((a,pc)=>a+(PIECE_SCORE[pc.status]??0),0)/list.length;
  return Math.min(95,Math.round(15+80*s));
}
/* custom steps (internal jobs) fold into the % — the standard pipeline is
   weighted like 4 steps, each custom step counts as one more slice */
function pct(p){
  const base=basePct(p);
  const steps=(p&&p.extraSteps)||[];
  if(!steps.length) return base;
  const W=4, done=steps.filter(s=>s.done).length;
  return Math.round(((base/100)*W+done)/(W+steps.length)*100);
}
/* 50% deposit / 50% final */
const halfOf=p=>Math.round((+p.cost||0)/2);
/* add-ons: extra charges logged mid-project — they sit on top of the 50/50 base */
const addonsOf=p=>(p&&p.addons)||[];
const addonTotal=p=>addonsOf(p).reduce((s,a)=>s+(+a.amount||0),0);
const addonPaid=p=>addonsOf(p).filter(a=>a.paid).reduce((s,a)=>s+(+a.amount||0),0);
const projTotal=p=>(+p.cost||0)+addonTotal(p);
const collected=p=>(p.depositPaid?halfOf(p):0)+(p.finalPaid?((+p.cost||0)-halfOf(p)):0)+addonPaid(p);
const projOutstanding=p=>projTotal(p)-collected(p);

/* every payment, from either source, with the date it actually landed */
function payments(){
  const out=[];
  projects.forEach(p=>{
    const h=halfOf(p), price=+p.cost||0; if(!price) return;
    if(p.depositPaid) out.push({when:p.depositPaidOn||p.dueISO||todayISO(),amount:h,
      label:`${p.title} — deposit`,clientId:p.clientId,kind:"project",pid:p.id,which:"deposit"});
    if(p.finalPaid)   out.push({when:p.finalPaidOn||p.dueISO||todayISO(),amount:price-h,
      label:`${p.title} — final`,clientId:p.clientId,kind:"project",pid:p.id,which:"final"});
  });
  /* add-ons live outside the deposit/final split, so they're counted on their own */
  projects.forEach(p=>{
    addonsOf(p).forEach((a,i)=>{ if(!a.paid) return;
      out.push({when:a.paidOn||a.addedOn||p.dueISO||todayISO(),amount:+a.amount||0,
        label:`${p.title} — ${a.label||"add-on"}`,clientId:p.clientId,

     label:i.label||"Invoice",clientId:i.clientId,kind:"invoice",pid:i.id}));
  return out.sort((a,b)=>(b.when||"").localeCompare(a.when||""));
}

/* ═══════════ SMS ═══════════
   Browser posts to a Twilio Function (endpoint + token live in config/public
   so every role can fire one). Real numbers live in config/sms, owner-only —
   kind:"studio" is routed to your number by the Function, so clients and
   editors never see it. */
async function sendSMS(kind,body,to){
  const url=smsPub.endpoint; if(!url) return;
  try{
    /* form-encoded = a "simple" request → no CORS preflight, and Twilio Functions
       parse it straight into `event`. fire-and-forget; we don't block on the reply. */
    const p=new URLSearchParams({kind:kind||"",to:to||"",body:body||"",token:smsPub.token||""});
    await fetch(url,{method:"POST",headers:{"Content-Type":"application/x-www-form-urlencoded"},body:p.toString()});
  }catch(e){ console.warn("SMS failed",e); }
}

/* ═══════════ CENTRALIZED ERROR LOG (Phase 1, Step 6) ═══════════
   One place every caught error passes through, so nothing silently
   vanishes into an empty catch block. Keeps a rolling in-memory log
   (visible via window.UTS_ERRORS in the console) in addition to the
   existing console.error + user-facing toast. Does not change what
   the user sees — same toasts as before — only adds visibility for
   whoever is debugging. */
window.UTS_ERRORS=[];
function errorLog(err,context){
  const entry={ when:new Date().toISOString(), context:context||"unknown", message:err&&err.message||String(err), code:err&&err.code||null };
  window.UTS_ERRORS.push(entry);
  if(window.UTS_ERRORS.length>200) window.UTS_ERRORS.shift();
  console.error(`[UTS ${entry.when}] ${entry.context}:`, err);
}

async function guard(fn,okMsg){
  try{ await fn(); if(okMsg) toast(okMsg); }
  catch(e){ errorLog(e,"guard"); toast(e.code==="permission-denied"?"Not allowed":"Save failed"); }
}

function _daysBetween(aISO,bISO){ return Math.round((new Date(bISO)-new Date(aISO))/864e5); }

function _clientPaymentReliability(clientInvoices){
  if(!clientInvoices.length) return null; // missing — no invoices at all for this client
  const today=todayISO();
  const overdue=clientInvoices.filter(i=>i.status!=="Paid"&&i.dueISO&&i.dueISO<today);
  const paidLate=clientInvoices.filter(i=>i.status==="Paid"&&i.dueISO&&i.paidOnISO&&i.paidOnISO>i.dueISO);
  const score=Math.max(0,100-overdue.length*30-paidLate.length*15);
  const positive=[], negative=[];
  if(!overdue.length&&!paidLate.length) positive.push("No overdue or late-paid invoices");
  if(overdue.length) negative.push(`${overdue.length} overdue invoice${overdue.length>1?"s":""}`);
  if(paidLate.length) negative.push(`${paidLate.length} invoice${paidLate.length>1?"s":""} paid after the due date`);
  return {score,positive,negative};
}

function _clientProjectMomentum(clientProjects){
  const active=clientProjects.filter(p=>!isLead(p)&&!p.deliveredTS);
  if(!active.length) return null; // missing — nothing active to measure momentum on
  const today=todayISO();
  const overdue=active.filter(p=>p.dueISO&&p.dueISO<today);
  const stale=active.filter(p=>p.updatedDate&&_daysBetween(p.updatedDate.slice(0,10),today)>14);
  const score=Math.max(0,100-overdue.length*30-stale.length*15);
  const positive=[], negative=[];
  if(!overdue.length&&!stale.length) positive.push("All active projects on schedule and recently updated");
  if(overdue.length) negative.push(`${overdue.length} active project${overdue.length>1?"s":""} past due date`);
  if(stale.length) negative.push(`${stale.length} project${stale.length>1?"s":""} not updated in 14+ days`);
  return {score,positive,negative};
}

function _clientApprovalFriction(clientProjects){
  const pieces=clientProjects.filter(p=>!isLead(p)).flatMap(p=>p.pieces||[]);
  if(!pieces.length) return null; // missing — no pieces recorded
  const revisions=pieces.filter(x=>x.status==="revisions").length;
  const score=Math.max(0,Math.round(100-(revisions/pieces.length)*80));
  const positive=[], negative=[];
  if(!revisions) positive.push("No pieces currently in revisions");
  else negative.push(`${revisions} of ${pieces.length} pieces currently in revisions`);
  return {score,positive,negative};
}

function _clientDeliverySpeed(clientProjects){
  const delivered=clientProjects.filter(p=>!isLead(p)&&p.deliveredTS);
  if(!delivered.length) return null; // missing — nothing delivered yet to measure
  const onTime=delivered.filter(p=>!p.dueISO||p.deliveredTS<=new Date(p.dueISO+"T23:59:59").getTime());
  const score=Math.round((onTime.length/delivered.length)*100);
  const positive=[], negative=[];
  if(onTime.length===delivered.length) positive.push("Every delivered project has shipped on or before its due date");
  else negative.push(`${delivered.length-onTime.length} of ${delivered.length} delivered projects shipped late`);
  return {score,positive,negative};
}

function computeClientHealth(client){
  const clientInvoices=invoices.filter(i=>i.clientId===client.id);
  const clientProjects=projects.filter(p=>p.clientId===client.id);
  const parts=[
    {key:"paymentReliability", label:"Payment reliability", weight:35, r:_clientPaymentReliability(clientInvoices)},
    {key:"projectMomentum",    label:"Project momentum",    weight:25, r:_clientProjectMomentum(clientProjects)},
    {key:"approvalFriction",   label:"Approval behavior",   weight:20, r:_clientApprovalFriction(clientProjects)},
    {key:"deliverySpeed",      label:"Delivery status",     weight:20, r:_clientDeliverySpeed(clientProjects)}
  ];
  const available=parts.filter(p=>p.r);
  const missing=parts.filter(p=>!p.r).map(p=>p.label);
  let score=null, positive=[], negative=[];
  if(available.length){
    const totalWeight=available.reduce((s,p)=>s+p.weight,0);
    score=Math.round(available.reduce((s,p)=>s+p.r.score*p.weight,0)/totalWeight);
    available.forEach(p=>{ positive.push(...p.r.positive); negative.push(...p.r.negative); });
  }
  if(client.retainerStatus) positive.push(`Retainer status: ${client.retainerStatus}`);
  let recommendedAction="Not enough data yet to recommend an action — this client has no invoices or projects recorded.";
  if(score!==null){
    if(negative.length) recommendedAction=`Address: ${negative[0]}`;
    else recommendedAction="No action needed — this client's tracked signals all look healthy.";
  }
  return {clientId:client.id,clientName:client.name,score,positive,negative,missing,recommendedAction};
}

function computeStudioHealth(){
  const today=todayISO();
  const ninetyAgo=new Date(Date.now()-90*864e5).toISOString().slice(0,10);
  const paidRecent=invoices.filter(i=>i.status==="Paid"&&i.paidOnISO&&i.paidOnISO>=ninetyAgo);
  const revenueCollected90d=paidRecent.reduce((s,i)=>s+(+i.amount||0),0);
  const unpaid=invoices.filter(i=>i.status!=="Paid");
  const outstandingAmount=unpaid.reduce((s,i)=>s+(+i.amount||0),0);
  const overdueInvoices=unpaid.filter(i=>i.dueISO&&i.dueISO<today);
  const activeProjects=projects.filter(p=>!isLead(p)&&!p.deliveredTS);
  const overdueProjects=activeProjects.filter(p=>p.dueISO&&p.dueISO<today);
  const delivered=projects.filter(p=>!isLead(p)&&p.deliveredTS&&p.dueISO);
  const latenessDays=delivered.map(p=>Math.max(0,_daysBetween(p.dueISO,new Date(p.deliveredTS).toISOString().slice(0,10))));
  const avgLateness=latenessDays.length?Math.round(latenessDays.reduce((a,b)=>a+b,0)/latenessDays.length*10)/10:null;
  const payablesOutstanding=payables.filter(x=>x.status!=="paid").reduce((s,x)=>s+(+x.amount||0),0);
  const clientScores=clients.map(computeClientHealth).filter(c=>c.score!==null);
  const avgClientHealth=clientScores.length?Math.round(clientScores.reduce((s,c)=>s+c.score,0)/clientScores.length):null;
  return {
    revenueCollected90d, outstandingAmount, overdueInvoiceCount:overdueInvoices.length,
    activeProjectCount:activeProjects.length, overdueProjectCount:overdueProjects.length,
    avgDeliveryLatenessDays:avgLateness, payablesOutstanding, avgClientHealth,
    clientScores, externalSources:EXTERNAL_SOURCES.map(s=>({...s,status:"not_connected"}))
  };
}
const healthService={ computeClientHealth, computeStudioHealth, EXTERNAL_SOURCES };

function live(q_,setter){
  return onSnapshot(q_,snap=>{
    setter(snap.docs.map(d=>({id:d.id,...d.data()})));
    paint();
  },err=>{ console.error("listener",err); });
}
function stopAll(){ unsubs.forEach(u=>u()); unsubs=[]; }

async function loadFor(user){
  stopAll();
  const email=user.email.toLowerCase();
  let profSnap;
  try{ profSnap=await getDoc(doc(db,"users",email)); }
  catch(e){ me=null; booting=false; gateMsg={t:"err",m:"Couldn't reach the database. Check your Firestore rules."}; return paint(); }

  if(!profSnap.exists()){
    me=null; booting=false;
    gateMsg={t:"err",m:"That login isn't set up with access yet. Ask Cody to add you."};
    await signOut(auth); return paint();
  }
  me={email,...profSnap.data()};
  booting=false;
  unsubs.push(onSnapshot(doc(db,"config","public"),d=>{ smsPub=d.exists()?d.data():{}; paint(); }));

  if(me.role==="owner"){
    view="owner";
    unsubs.push(onSnapshot(doc(db,"config","sms"),d=>{ settings=d.exists()?d.data():{}; paint(); }));
    unsubs.push(onSnapshot(doc(db,"config","tracking"),d=>{ tracking=d.exists()?d.data():{}; paint(); }));
    unsubs.push(onSnapshot(doc(db,"config","folderPresets"),d=>{ folderPresets=d.exists()?{presets:[],defaultName:null,...d.data()}:{presets:[],defaultName:null}; paint(); }));
    unsubs.push(live(collection(db,"bank_accounts"),  v=>bankAccounts=v));
    unsubs.push(live(collection(db,"bank_txns"),      v=>bankTxns=v));
    unsubs.push(live(collection(db,"bank_recurring"), v=>bankRecurring=v));
    unsubs.push(live(collection(db,"txn_rules"),      v=>txnRules=v));
    unsubs.push(live(collection(db,"clients"),  v=>clients=v));
    unsubs.push(live(collection(db,"projects"), v=>{ leads=v.filter(isLead); projects=v.filter(p=>!isLead(p)); }));
    unsubs.push(live(collection(db,"invoices"), v=>invoices=v));
    unsubs.push(live(collection(db,"payables"), v=>payables=v));
    unsubs.push(live(collection(db,"drives"),   v=>drives=v));
    unsubs.push(live(collection(db,"inventory"),v=>{ inventory=v; invLoaded=true; }));
    unsubs.push(live(collection(db,"activity"), v=>activity=v.sort((a,b)=>(b.ts||0)-(a.ts||0))));
    unsubs.push(live(collection(db,"users"),    v=>users=v.map(u=>({...u,email:u.id}))));
  }
  else if(me.role==="client"){
    view="client";
    const cid=me.clientId;
    unsubs.push(onSnapshot(doc(db,"clients",cid),d=>{ clients=d.exists()?[{id:d.id,...d.data()}]:[]; paint(); }));
    unsubs.push(live(query(collection(db,"projects"),where("clientId","==",cid)), v=>projects=v.filter(p=>!isLead(p))));
    unsubs.push(live(query(collection(db,"invoices"),where("clientId","==",cid)), v=>invoices=v));
    unsubs.push(live(query(collection(db,"activity"),where("clientId","==",cid)),
                     v=>activity=v.sort((a,b)=>(b.ts||0)-(a.ts||0))));
  }
  else if(me.role==="editor"){
    view="editor";
    const nm=me.editorName;
    /* two listeners: the roster field, plus legacy docs that predate it */
    let byRoster=[], byLegacy=[];
    const mergeEd=()=>{ const seen=new Set(); projects=[...byRoster,...byLegacy]
      .filter(p=>!isLead(p)&&!seen.has(p.id)&&seen.add(p.id)); };
    unsubs.push(live(query(collection(db,"projects"),where("editors","array-contains",nm)),
      v=>{ byRoster=v; mergeEd(); }));
    unsubs.push(live(query(collection(db,"projects"),where("editor","==",nm)),
      v=>{ byLegacy=v; mergeEd(); }));
    unsubs.push(live(query(collection(db,"payables"),where("editor","==",nm)), v=>payables=v));
    unsubs.push(live(collection(db,"clients"), v=>clients=v));
  }
  paint();
}

async function setPieceStatus(pid,i,status){
  const p=byId(projects,pid); if(!p) return;
  const was=p.pieces?.[i]?.status; if(was===status) return;
  const nm=p.pieces?.[i]?.name||"";
  const pieces=p.pieces.map((x,ix)=>ix===i?{...x,status}:x);
  const patch={pieces};
  if(!p.editStart && pieces.some(x=>x.status!=="queued")) patch.editStart=todayISO();
  if(status!=="revisions" && !pieces.some(x=>x.status==="revisions")) patch.revisionNote=null;
  const approvals={...(p.approvals||{})};
  if(status==="revisions"||status==="editing"){ delete approvals[i]; patch.approvals=approvals; }
  await guard(()=>updateDoc(doc(db,"projects",pid),patch),PIECE_LABEL[status]);
  if(status==="review"){
    logActivity(p.clientId,`${nm} posted for review`);
    if(me.role==="editor")                    /* editor posted it → text the studio */
      sendSMS("studio",`REVIEW READY — ${p.title}: ${nm} (${me.editorName||"editor"})${reviewLink(p,pieces[i])?" "+reviewLink(p,pieces[i]):""}`);
    if(me.role==="owner"){                    /* you posted it → text the client */
      const ph=clientPhone(p.clientId);

/* ── retainer helpers ── */
/* retainer status: "active" | "inactive" | null (not a retainer).
   Legacy clients with isRetainer:true read as active. */
const retainerStatusOf=c=>{ if(!c) return null;
  if(c.retainerStatus==="active"||c.retainerStatus==="inactive") return c.retainerStatus;
  return c.isRetainer?"active":null; };
const isRetainer=c=>!!retainerStatusOf(c);                 /* has a retainer relationship at all */
const isActiveRetainer=c=>retainerStatusOf(c)==="active";
const retainerValue=c=>isRetainer(c)?(+c.retainerValue||0):0;
const retainerClients=()=>clients.filter(isRetainer);
const activeRetainerClients=()=>clients.filter(isActiveRetainer);
/* only ACTIVE retainers count toward money "held per month" */
const monthlyRetainerTotal=()=>activeRetainerClients().reduce((s,c)=>s+retainerValue(c),0);
/* the date they last flipped to their current status — drives the longevity view */
const retainerSince=c=>{ const st=retainerStatusOf(c);
  return st==="active"?(c.retainerActiveSince||null):st==="inactive"?(c.retainerInactiveSince||null):null; };
const retainerOf=pid=>{ const p=byId(projects,pid); const c=p?byId(clients,p.clientId):null;
  return isRetainer(c)?c:null; };

/* ═══════════ SHARED RENDER PIECES ═══════════ */
function arc(p){
  const f=p/100, r=26, cx=36, cy=34, a=Math.PI-f*(Math.PI*.85);
  const sx=cx+r*Math.cos(a), sy=cy-r*Math.sin(a)*.9;
  let rays="";
  if(p===100) for(const d of [0,45,90,135,180]){ const ra=d*Math.PI/180;
    rays+=`<line x1="${sx+9*Math.cos(ra)}" y1="${sy-9*Math.sin(ra)}" x2="${sx+13*Math.cos(ra)}" y2="${sy-13*Math.sin(ra)}" stroke="${T.gold}" stroke-width="1.5" stroke-linecap="round"/>`; }
  return `<svg width="72" height="52" viewBox="0 0 72 52" aria-label="${p}% complete">
    <path d="M ${cx-r} ${cy} A ${r} ${r} 0 0 1 ${cx+r} ${cy}" fill="none" stroke="${T.line}" stroke-width="2"/>

    <span class="lbl" style="color:${cur?T.gold:on?T.muted:T.dim}">${s}</span></div>`;}).join("")+`</div>`;};
function chips(p){

    const c=STATUS_COLOR[pc.status];
    return `<span class="chip" style="color:${pc.status==="queued"?T.dim:c};border:1px solid ${c}55;background:${c}10">

      ${esc(pc.name.split(" — ")[0])} · ${PIECE_LABEL[pc.status]}</span>`;}).join("")+`</div>`;
}
function slaChip(p){
  const d=daysIn(p.editStart);
  if(!p.editStart||p.stage<2||pct(p)===100||d==null) return "";
  const over=d>SLA, warn=d>=5&&!over, c=over?T.red:warn?T.gold:T.muted;
  return `<span class="sla" style="color:${c};border:1px solid ${c}55;background:${c}12">${over?`⚠ DAY ${d} — OVER SLA`:`EDIT DAY ${d}/${SLA}`}</span>`;
}

/* anything on a project card can be changed without opening the form */
async function setStage(pid,v){
  const p=byId(projects,pid); if(!p) return;
  const patch={stage:+v};
  if(+v>=2 && !p.editStart) patch.editStart=todayISO();
  if(!p.createdTS) patch.createdTS=projStartTS(p)||Date.now();   /* start the clock for older projects */
  if(+v>=4) patch.deliveredTS=p.deliveredTS||Date.now();         /* freeze total on delivery */
  else if(p.deliveredTS) patch.deliveredTS=null;                 /* reopened — clock runs again */
  await guard(()=>updateDoc(doc(db,"projects",pid),patch),stageLabel(p,+v));
  if(+v===4) logActivity(p.clientId,`${p.title} delivered`);
}

/* ═══════════ CLIENT VIEW ═══════════ */
function clientView(cid){
  const c=byId(clients,cid);
  if(!c) return `<div class="panel"><div class="empty-state"><div class="t">Nothing here yet</div>
    <div class="s">Your projects will show up here as soon as they're set up.</div></div></div>`;
  const mine=projectsOf(cid), inv=invoicesOf(cid);
  const _thisM=new Date().toISOString().slice(0,7);
  const paidThisMonth=paymentsOf(cid).filter(x=>(x.when||"").startsWith(_thisM)).reduce((s,x)=>s+x.amount,0);
  const paidAllTime=paymentsOf(cid).reduce((s,x)=>s+x.amount,0);
  const projBilled=mine.reduce((s,p)=>s+projTotal(p),0);
  const projPaid=mine.reduce((s,p)=>s+collected(p),0);
  const billed=inv.reduce((s,i)=>s+(+i.amount||0),0)+projBilled;
  const paidT=inv.filter(i=>i.status==="Paid").reduce((s,i)=>s+(+i.amount||0),0)+projPaid;
  const due=billed-paidT, paidPct=billed?Math.round(paidT/billed*100):100;
  const payRows=mine.filter(p=>+p.cost||addonTotal(p)).map(p=>{
    const h=halfOf(p), rest=(+p.cost||0)-h;
    return [{lbl:`${p.title} — deposit`,amt:h,ok:p.depositPaid,on:p.depositPaidOn},
            {lbl:`${p.title} — final payment`,amt:rest,ok:p.finalPaid,on:p.finalPaidOn},
            ...addonsOf(p).map(a=>({lbl:`${p.title} — ${a.label||"add-on"}`,
              amt:+a.amount||0,ok:!!a.paid,on:a.paidOn}))];
  }).flat();

  const waiting=[];
  mine.forEach(p=>(p.pieces||[]).forEach((pc,i)=>{ if(pc.status==="review") waiting.push({p,pc,i}); }));

  const reviewRows=waiting.length===0
    ? `<div style="font-size:13px;color:var(--dim)">Nothing waiting on you right now. New cuts land here the moment they're posted.</div>`
    : `<div class="grid-gap cards">`+waiting.map(({p,pc,i})=>{
        const ok=(p.approvals||{})[i];
        return `<div class="card" style="align-items:center;justify-content:space-between">
        <div><div style="font-size:14px;font-weight:700">${esc(pc.name)}</div>
          <div class="inv-meta" style="margin-top:2px">${esc(p.title)}</div></div>
        <div style="display:flex;gap:8px;flex-wrap:wrap">
          ${reviewLink(p,pc)?`<a class="btn outline link" href="${esc(reviewLink(p,pc))}" target="_blank" rel="noopener">OPEN IN FRAME.IO ↗</a>`:""}
          ${ok?`<span class="done-note">&#10003; APPROVED</span>`
              :`<button class="btn ghost" style="border-color:rgba(240,85,107,.45);color:var(--red)" data-revform="${esc(p.id)}:${i}">REVISIONS NEEDED</button>
                <button class="btn gold" data-approve="${esc(p.id)}:${i}">APPROVE</button>`}
        </div></div>`;}).join("")+`</div>`;

  const acts=activityOf(cid);
  return `

/* ═══════════ QUOTE BUILDER (embedded) ═══════════ */
/* The builder keeps its own CSS and its own globals. Rather than merge two
   stylesheets and two render loops, it runs in a same-origin srcdoc frame and
   the portal reaches in: Firestore reads and writes go through the session
   that's already signed in here, and its Send-to-inbound button lands a lead
   on the board. Same file, same data, no collisions. */
let qbFrame=null, qbReady=false, qbState=null;
let qbTargetLeadId=null, qbPrefill=null;  /* set when building a proposal FOR a specific inbound lead */

function quoteView(){
  return `<div class="hero"><div><h1>Quote Builder<span>.</span></h1>
    <div class="sub">Build it, save it, send it straight to the inbound board</div></div>
    <div style="display:flex;gap:8px;flex-wrap:wrap">
      <button class="btn outline" data-qbreload="1">RELOAD MENU</button>
    </div></div>
  <section class="panel" style="padding:0;overflow:hidden"><div id="qbMount"></div></section>`;
}

function mountQB(){
  const mount=document.getElementById("qbMount");
  if(!mount) return;
  qbFrame=document.createElement("iframe");
  qbFrame.id="qbFrame";
  qbFrame.setAttribute("title","Quote Builder");
  qbFrame.style.cssText="width:100%;border:0;display:block;min-height:900px;background:transparent";
  const src=document.getElementById("qbSrc").textContent
    .replace(/<\\\/script>/g,"<\/script>")
    .replace(/<\\script/g,"<"+"script")
    .replace(/<\\!--/g,"<"+"!--");
  mount.appendChild(qbFrame);
  /* written in rather than srcdoc: same-origin either way, but this fires
     synchronously so we can wire the bridge without racing the load event */
  const fd=qbFrame.contentDocument;
  fd.open(); fd.write(src); fd.close();
  setTimeout(()=>wireQB(),0);
  return;
  mount.appendChild(qbFrame);
}

function wireQB(tries){
  tries=tries||0;
  const w=qbFrame&&qbFrame.contentWindow;
  if(!w||!w.S||typeof w.render!=="function"){
    if(tries<60) return setTimeout(()=>wireQB(tries+1),50);
    return console.warn("quote builder didn't boot");
  }
  qbReady=true;
  w.UTS_LOGO=LOGO;
  const mark=w.document.getElementById("logoMark"); if(mark) mark.src=LOGO;

  /* the seam the builder already ships with */
  w.UTS_PUSH_LEAD = payload => leadFromQuote(payload);

  /* its cloud buttons, rerouted through the portal's authenticated session */
  w.loadCloud = async () => {
    try{
      const pub=await getDoc(doc(db,"quoteBuilder","public"));
      if(pub.exists()){ const d=pub.data();
        if(d.catalog)  w.S.catalog=d.catalog;
        if(d.packages) w.S.packages=d.packages;
        if(d.terms)    w.S.terms=d.terms; }
      const priv=await getDoc(doc(db,"quoteBuilder","private"));
      if(priv.exists()){ const costs=priv.data().costs||{};
        w.S.catalog.forEach(x=>{ if(costs[x.id]!=null) x.cost=costs[x.id]; });
        w.S.packages.forEach(p=>(p.lines||[]).forEach(l=>{ if(l.src&&costs[l.src]!=null) l.cost=costs[l.src]; })); }
      w.fill(); w.render(); sizeQB();
    }catch(e){ console.warn("qb load",e); w.toast&&w.toast("Couldn't load the menu"); }
  };
  w.saveCloud = async () => {
    const strip=a=>a.map(({cost,...r})=>r);
    const costs={}; w.S.catalog.forEach(x=>costs[x.id]=x.cost||0);
    try{
      await setDoc(doc(db,"quoteBuilder","public"),{
        catalog:strip(w.S.catalog),
        packages:w.S.packages.map(p=>({...p,lines:strip(p.lines||[])})),
        terms:w.S.terms, updatedAt:new Date().toISOString()});
      await setDoc(doc(db,"quoteBuilder","private"),{costs,updatedAt:new Date().toISOString()});
      w.toast&&w.toast("Saved — the public quote page reads this too");
    }catch(e){ console.warn("qb save",e); w.toast&&w.toast("Save failed — check the rules"); }
  };
  w.toggleAuth = () => w.toast&&w.toast("You're already signed in through the portal");

  /* only pull from the cloud on first mount — if we're restoring a state
     snapshot from before the tab was left, that snapshot IS the unsaved
     work, and re-fetching here would silently wipe it out again */
  const hadLocalState=!!qbState;
  if(qbState){ try{ Object.assign(w.S,qbState); }catch(e){} }
  if(!hadLocalState) w.loadCloud();
  else { w.fill&&w.fill(); w.render(); sizeQB(); }
  if(qbPrefill){ try{ w.S.client=w.S.client||{};
      if(qbPrefill.name) w.S.client.name=qbPrefill.name;
      if(qbPrefill.proj) w.S.client.proj=qbPrefill.proj;
      w.fill&&w.fill(); w.render&&w.render(); sizeQB();
    }catch(e){} qbPrefill=null; }
  clearInterval(wireQB._t);
  wireQB._t=setInterval(()=>{ if(qbFrame&&qbFrame.isConnected) captureQB(); },1500);
  sizeQB(); setTimeout(sizeQB,400);
  try{ new w.ResizeObserver(sizeQB).observe(w.document.body); }catch(e){ setInterval(sizeQB,1200); }
}
function captureQB(){
  const w=qbFrame&&qbFrame.contentWindow;
  if(!w||!w.S) return;
  try{ qbState=JSON.parse(JSON.stringify(w.S)); }catch(e){}
}
let qbLastH=0,qbSizeRAF=null;
function sizeQB(){
  if(qbSizeRAF) return;
  qbSizeRAF=requestAnimationFrame(()=>{
    qbSizeRAF=null;
    const w=qbFrame&&qbFrame.isConnected&&qbFrame.contentWindow;
    if(!w||!w.document||!w.document.body) return;
    const doc=w.document.documentElement, bod=w.document.body;
    const h=Math.max(760,(Math.max(bod.scrollHeight,doc?doc.scrollHeight:0))+30);
    /* Asymmetric tolerance kills the "scrollbar keeps shrinking" jitter:
       grow readily (+30px), but only shrink on a real collapse (-140px).
       Mid-render the frame momentarily reports a shorter body, and letting
       that through was making the outer page scrollbar bounce every redraw. */
    if(h>qbLastH+30 || h<qbLastH-140){
      qbLastH=h;
      qbFrame.style.height=h+"px";
    }
  });
}

/* a finished quote becomes a lead sitting at Proposal Out */
async function leadFromQuote(q){
  const now=new Date().toISOString();
  /* building for an existing inbound lead → attach the quote to it, don't duplicate */
  if(qbTargetLeadId){
    const target=qbTargetLeadId, l=byId(leads,target); qbTargetLeadId=null;
    if(l){
      const quote={number:q.quoteNumber||"",value:q.value||0,deposit:q.deposit||0,
        scope:q.scope||"",package:q.package||"",usage:q.usage||"",
        expires:q.expires||"",link:q.quoteLink||"",quotedAt:q.quotedAt||now};
      const quoteLines=(q.deliverables||[]).map(d=>({name:d.name,qty:d.qty||1,optional:!!d.optional}));
      const touch={at:now,type:"Quote sent",
        note:`${q.package||"Custom build"} · ${money(q.value||0)}${q.usage?" · "+q.usage:""}`,sys:true};
      await guard(()=>updateDoc(doc(db,"projects",target),
        {leadStage:"proposal",quote,quoteLines,touches:[...(l.touches||[]),touch]}),null);
      toast("Proposal attached to "+(l.name||"lead"));
      view="inbound"; paint();
      return;
    }
  }
  const lead={
    pipeline:"lead", leadStage:q.leadStage||"proposal",
    clientId:null, editor:null,
    name:q.name||"Unnamed lead",
    ask:q.project||q.package||"Package quote",
    channel:q.source==="client-built-quote"?"Form":"Quote",
    budget:money(q.value||0),
    contact:[q.email,q.phone].filter(Boolean).join(" · ")||"",
    createdAt:now,
    firstReplyAt:q.source==="client-built-quote"?null:now,
    nextFollowUp:q.followUpBy||null,
    quote:{number:q.quoteNumber||"",value:q.value||0,deposit:q.deposit||0,
      scope:q.scope||"",package:q.package||"",usage:q.usage||"",
      expires:q.expires||"",link:q.quoteLink||"",quotedAt:q.quotedAt||now},
    quoteLines:(q.deliverables||[]).map(d=>({name:d.name,qty:d.qty||1,optional:!!d.optional})),
    touches:[{at:now,type:q.source==="client-built-quote"?"Package request received":"Quote sent",
      note:`${q.package||"Custom build"} · ${money(q.value||0)}${q.usage?" · "+q.usage:""}`,sys:true}]
  };
  await addDoc(collection(db,"projects"),lead);
  toast("On the inbound board at Proposal Out");
}

/* CREATE PROPOSAL on a lead → open the builder prefilled + attach the result back to that lead */
function startProposalForLead(id){
  const l=byId(leads,id); if(!l) return;

/* ═══════════ SOCIAL CALENDAR ═══════════ */
let calMonth=todayISO().slice(0,7), calType="Reel";
const monthLabel=m=>{const d=new Date(m+"-01T00:00:00");
  return d.toLocaleString(undefined,{month:"long",year:"numeric"});};
const shiftMonth=(m,n)=>{const d=new Date(m+"-01T00:00:00"); d.setMonth(d.getMonth()+n);
  return d.toISOString().slice(0,7);};
const postsOf=p=>(p.posts||[]).slice().sort((a,b)=>a.d<b.d?-1:1);

/* the calendar engine runs on whatever holds the posts — now a CLIENT
   (each month is a new project, so the schedule lives on the client), with
   legacy support for a project host. Resolve id -> {coll, ent}. */
function socialHost(id){
  const c=byId(clients,id); if(c) return {coll:"clients",ent:c};
  const p=byId(projects,id); if(p) return {coll:"projects",ent:p};
  return null;
}
/* after a change, refresh whichever surface is open */
function reflowSocial(){
  if(openClient) return paint();
  if(openProject) return renderDetail();
  paint();
}

/* ── recurring rules ──────────────────────────────────────────────
   A rule like "Reels — every Tuesday" fills the whole calendar without
   anything being written per day. Only the exceptions get stored:
   postDone holds the ones you've ticked, postSkip the ones you deleted.
   Key format is "YYYY-MM-DD|Type". */
const DOW_FULL=["Sunday","Monday","Tuesday","Wednesday","Thursday","Friday","Saturday"];
const DOW_SHORT=["Sun","Mon","Tue","Wed","Thu","Fri","Sat"];
const rulesOf=p=>(p&&p.postRules)||[];
const ruleKey=(iso,type)=>`${iso}|${type}`;
const monthDays=m=>{const f=new Date(m+"-01T00:00:00");
  return new Date(f.getFullYear(),f.getMonth()+1,0).getDate();};

/* every rule-generated post for one month, already merged with done/skip */
function rulePosts(p,month){
  const rules=rulesOf(p); if(!rules.length) return [];
  const f=new Date(month+"-01T00:00:00");
  const done=new Set(p.postDone||[]), skip=new Set(p.postSkip||[]);
  const out=[];
  for(let d=1;d<=monthDays(month);d++){
    const iso=`${month}-${String(d).padStart(2,"0")}`;
    const dow=new Date(f.getFullYear(),f.getMonth(),d).getDay();
    rules.forEach(r=>{
      if(dow!==+r.dow) return;
      if(r.from&&iso<r.from) return;
      if(r.until&&iso>r.until) return;
      const k=ruleKey(iso,r.type);
      if(skip.has(k)) return;
      out.push({d:iso,type:r.type,posted:done.has(k),rule:true,key:k});
    });
  }
  return out;
}
/* rule posts across a window — used by the alert digest */
function rulePostsRange(p,fromISO,toISO){
  const months=new Set([fromISO.slice(0,7),toISO.slice(0,7)]);
  return [...months].flatMap(m=>rulePosts(p,m)).filter(x=>x.d>=fromISO&&x.d<=toISO);
}

function socialPanel(p){
  if(!p) return "";
  const posts=postsOf(p), types=typesFor(p), rules=rulesOf(p);
  const virt=rulePosts(p,calMonth);
  const first=new Date(calMonth+"-01T00:00:00");
  const pad=first.getDay(), days=monthDays(calMonth);
  const cells=[];
  for(let i=0;i<pad;i++) cells.push(`<div class="cal-cell empty"></div>`);
  for(let d=1;d<=days;d++){
    const iso=`${calMonth}-${String(d).padStart(2,"0")}`;
    const mine=posts.filter(x=>x.d===iso);
    const vs=virt.filter(x=>x.d===iso);
    const isToday=iso===todayISO();
    cells.push(`<div class="cal-cell${isToday?" today":""}" data-calday="${esc(p.id)}:${iso}">
      <span class="cal-n">${d}</span>
      ${mine.map((x,i)=>`<span class="cal-post${x.posted?" done":""}"
        data-calchip="${esc(p.id)}:${iso}:${i}" title="${x.posted?"Posted":"Scheduled"} — click to toggle">
        ${esc(x.type)}${x.posted?" ✓":""}</span>`).join("")}
      ${vs.map(x=>`<span class="cal-post rule${x.posted?" done":""}"
        data-calrule="${esc(p.id)}|${esc(x.key)}" title="Recurring ${esc(x.type)} — click to check off, shift-click to skip this week">
        ${esc(x.type)}${x.posted?" ✓":""}</span>`).join("")}
    </div>`);
  }
  const all=[...posts,...virt];
  const upcoming=all.filter(x=>!x.posted&&x.d>=todayISO()).sort((a,b)=>a.d<b.d?-1:1)[0];
  const ruleBar=rules.length

    all[target].posted?"Marked posted":"Back to scheduled");

/* posts we owe today or tomorrow, for the alert strip and notifications */
function postDigest(){
  const t=todayISO(), tm=addDays(t,1), out=[];
  const back=addDays(t,-14);
  clients.filter(c=>c.socialManaged).forEach(c=>{
    const rule=rulePostsRange(c,back,tm);
    [...(c.posts||[]),...rule].forEach(x=>{
      if(x.posted) return;
      if(x.d===t)  out.push({c,post:x,when:"TODAY",kind:"post-today"});
      else if(x.d===tm) out.push({c,post:x,when:"TOMORROW",kind:"post-tomorrow"});
      else if(x.d<t&&x.d>=back) out.push({c,post:x,when:`${Math.abs(dayDiff(x.d))}D LATE`,kind:"post-late"});
    });
  });
  return out;
}

/* ═══════════ TIMING, COMPACT BOARD, DETAIL ═══════════ */
const dayDiff=iso=>{ if(!iso) return null;
  const a=new Date(iso+"T00:00:00"), b=new Date(); b.setHours(0,0,0,0);
  return Math.round((a-b)/864e5); };
const addDays=(iso,n)=>{ if(!iso) return null;
  const d=new Date(iso+"T00:00:00"); d.setDate(d.getDate()+n); return d.toISOString().slice(0,10); };

/* first draft counts as in once every deliverable has left the edit bay */
function draftIn(p){
  const l=p.pieces||[];
  if(l.length) return l.every(x=>x.status!=="queued"&&x.status!=="editing");
  return (+p.stage||0)>=3;
}
const draftDue=p=>p.draftDueISO||(p.editStart?addDays(p.editStart,DRAFT_SLA):null);

/* {k, label} — k drives the colour: ok | soon | late */
function deliveryState(p){
  if(pct(p)===100||(+p.stage||0)===4) return {k:"ok",label:"DELIVERED"};
  const d=dayDiff(p.dueISO);
  if(d===null) return {k:"ok",label:"NO DUE DATE"};
  if(d<0)  return {k:"late",label:`${-d}D OVERDUE`};
  if(d===0)return {k:"late",label:"DUE TODAY"};
  if(d===1)return {k:"soon",label:"DUE TOMORROW"};
  return {k:d<=NEAR?"soon":"ok",label:`DUE IN ${d}D`};
}
function draftState(p){
  if((+p.stage||0)<2||pct(p)===100) return null;
  if(draftIn(p)) return {k:"ok",label:"DRAFT IN"};
  const dd=draftDue(p);
  if(!dd) return {k:"soon",label:"NO EDIT START"};
  const d=dayDiff(dd);
  if(d<0)  return {k:"late",label:`DRAFT ${-d}D LATE`};
  if(d===0)return {k:"late",label:"DRAFT DUE TODAY"};
  if(d===1)return {k:"soon",label:"DRAFT DUE TOMORROW"};
  return {k:"ok",label:`DRAFT IN ${d}D`};
}
const worstK=(...ks)=>ks.includes("late")?"late":ks.includes("soon")?"soon":"ok";
function projState(p){
  const d=deliveryState(p), dr=draftState(p);
  if(needsRev(p)) return "late";
  return worstK(d.k, dr?dr.k:"ok");
}
const K_COLOR={ok:T.muted,soon:T.gold,late:T.red};

function miniCard(p){
  const k=projState(p), d=deliveryState(p), dr=draftState(p);
  const l=p.pieces||[], done=l.filter(x=>x.status==="done").length;
  const tMS=projElapsedMS(p), tLive=pct(p)!==100, tStart=projStartTS(p);
  const tag=(txt,kk)=>`<span class="m-tag" style="color:${K_COLOR[kk]||"var(--dim)"};border-color:${kk&&kk!=="ok"?K_COLOR[kk]+"55":"var(--line)"};background:${kk&&kk!=="ok"?K_COLOR[kk]+"12":"transparent"}">${txt}</span>`;
  return `<button class="pmini st-${k}" data-open="${esc(p.id)}">
    <span class="m-pct">${pct(p)}<span>%</span></span>
    <div class="m-id">${esc(p.code||p.type||"—")}${p.code&&p.type?" · "+esc(p.type):""}</div>
    <div class="m-title">${esc(p.title||"Untitled")}</div>
    <div class="m-client">${esc(clientName(p.clientId))}</div>
    ${tMS!=null?`<div class="m-clock" ${tLive&&tStart?`data-elapsed-live="1" data-elapsed-since="${tStart}"`:""}>&#9201; ${elapsedDH(tMS)}${tLive?"":" · total"}</div>`:""}
    <div class="m-bar"><i style="width:${pct(p)}%"></i></div>
    <div class="m-tags">
      ${tag(stageLabel(p,+p.stage||0).toUpperCase())}
      ${tag(d.label,d.k)}
      ${dr?tag(dr.label,dr.k):""}
      ${l.length>1?tag(`${done}/${l.length} DONE`):""}
      ${needsRev(p)?tag("REVISIONS","late"):""}
      ${p.editor?tag(esc(p.editor)):""}
    </div></button>`;
}

/* ── the board ── */
function projectBoard(){
  const live=projects.filter(p=>pct(p)<100);
  const pool=projFilter==="done"?projects.filter(p=>pct(p)===100)
            :projFilter==="late"?live.filter(p=>projState(p)==="late")

    .sort((a,b)=>{ const r={late:0,soon:1,ok:2};

  const f=(k,lbl,n)=>`<button class="${projFilter===k?"on":""}" data-pfilter="${k}">${lbl}${n!==undefined?` ${n}`:""}</button>`;

/* ── alerts ── */
function digest(){
  const live=projects.filter(p=>pct(p)<100);
  const out=[];
  const push=(o)=>out.push(o);
  live.forEach(p=>{
    const meta=`${clientName(p.clientId)}${p.editor?" · "+p.editor:""}`;
    const base={title:p.title,meta,openId:p.id,openKind:"project"};
    const d=deliveryState(p), dr=draftState(p);
    if(d.k==="late")  push({...base,kind:"delivery",label:d.label});
    else if(d.k==="soon") push({...base,kind:"delivery-soon",label:d.label});
    if(dr&&dr.k==="late") push({...base,kind:"draft",label:dr.label});
    if(needsRev(p)) push({...base,kind:"revision",label:"CLIENT REVISIONS"});
  });
  postDigest().forEach(x=>push({
    title:`${clientName(x.c.id)} — ${x.post.type}`,
    meta:`social · ${isoShort(x.post.d)}`,
    openId:x.c.id, openKind:"client",
    kind:x.kind, label:`${x.post.type.toUpperCase()} POST ${x.when}`}));
  return out.sort((a,b)=>(a.label.includes("OVERDUE")||a.label.includes("LATE")?0:1)
                        -(b.label.includes("OVERDUE")||b.label.includes("LATE")?0:1));
}
function alertStrip(){
  const d=digest().filter(x=>x.kind!=="delivery-soon"||true);
  if(!d.length) return "";
  const canText=!!(smsPub.endpoint&&settings.studio);

    ${d.slice(0,8).map(x=>`<div class="alert-row" ${x.openKind==="client"?`data-openclient="${esc(x.openId)}"`:`data-open="${esc(x.openId)}"`}>
      <div><div class="a-t">${esc(x.title)}</div>

      <span class="sla" style="color:${warm(x.kind)?T.gold:T.red};border:1px solid ${(warm(x.kind)?T.gold:T.red)}55;background:${(warm(x.kind)?T.gold:T.red)}12">${esc(x.label)}</span>
    </div>`).join("")}
    ${d.length>8?`<div class="a-m" style="padding-top:8px">+ ${d.length-8} more</div>`:""}
    <div class="a-m" style="padding-top:9px;color:var(--dim)">Browser alerts fire while the portal is open. For texts when it's closed, hook up the Twilio function under Alerts &amp; Numbers.</div>
  </div>`;
}
const notifyOn=()=>typeof Notification!=="undefined"&&Notification.permission==="granted";
async function askAlerts(){
  if(typeof Notification==="undefined") return toast("This browser can't do alerts");
  if(Notification.permission==="granted") return toast("Alerts already on");
  const r=await Notification.requestPermission();
  toast(r==="granted"?"Alerts on":"Alerts blocked in browser settings");
  paint();
}
const seenKey=(id,kind)=>`uts-alert:${id}:${kind}:${todayISO()}`;
function fireAlerts(){
  if(!me||me.role!=="owner"||!notifyOn()) return;
  digest().filter(x=>x.kind!=="delivery-soon").forEach(x=>{
    const k=seenKey(x.openId,x.kind+":"+x.label);
    try{ if(localStorage.getItem(k)) return; localStorage.setItem(k,"1"); }catch(e){}
    try{ new Notification(`${x.label} — ${x.title}`,
      {body:x.meta,tag:k}); }catch(e){}
  });
}
async function textDigest(){

const leadMins=iso=>Math.max(0,Math.round((Date.now()-new Date(iso).getTime())/6e4));
const leadFmt=m=>m<60?m+"m":m<1440?Math.floor(m/60)+"h":Math.floor(m/1440)+"d";
const leadStamp=iso=>new Date(iso).toLocaleString(undefined,{month:"short",day:"numeric",hour:"numeric",minute:"2-digit"});
const lastTouch=l=>(l.touches||[]).slice().sort((a,b)=>new Date(b.at)-new Date(a.at))[0]||null;
const leadOverdue=l=>l.nextFollowUp&&l.nextFollowUp<todayISO();

function leadClock(l){
  if(!l.firstReplyAt){
    const m=leadMins(l.createdAt);
    return {k:m<SLA_MIN?"ok":m<SLA_MIN*3?"warn":"bad",t:"NO REPLY · "+leadFmt(m),c:m<SLA_MIN?T.green:m<SLA_MIN*3?T.gold:T.red};
  }
  const tch=lastTouch(l);
  if(!tch) return {k:"ok",t:"REPLIED",c:T.green};
  const d=leadMins(tch.at)/1440;
  return {k:d<STALE_DAYS?"ok":d<STALE_DAYS*2?"warn":"bad",
          t:tch.type.toUpperCase()+" "+leadFmt(leadMins(tch.at))+" AGO",
          c:d<STALE_DAYS?T.green:d<STALE_DAYS*2?T.gold:T.red};
}
function leadTemplates(l){
  const who=(l.name||"there").replace(/^@/,"").split(" ")[0];
  return [
    ["Real prospect",`Hey ${who} — Cody with Under The Sun Studios. Thanks for reaching out about ${l.ask||"the project"}.

Two quick questions so I can get you a real number: when do you need it live, and is this a one-off or something running monthly?

Happy to jump on a 10 minute call today if that's easier.`],
    ["Price shopper",`Hey ${who} — Cody at Under The Sun Studios. Appreciate you reaching out.

Projects like this usually land between $2-6k depending on shoot days and how many cuts you need. If that's the right neighborhood, send me your deadline and I'll put an exact quote together.`],
    ["Referral",`Hey ${who} — Cody with Under The Sun Studios. Glad the referral sent you my way.

Tell me what you're picturing for ${l.ask||"this"} and roughly when you need it, and I'll come back with a plan and pricing today.`]
  ];
}

function leadActivityDays(){
  const labels=["Su","Mo","Tu","We","Th","Fr","Sa"];
  const all=leads.flatMap(l=>(l.touches||[]).map(t=>({...t,leadId:l.id})));
  return Array.from({length:14},(_,i)=>{const d=new Date();d.setHours(0,0,0,0);d.setDate(d.getDate()-(13-i));const key=localISO(d),next=new Date(d);next.setDate(next.getDate()+1);
    const rows=all.filter(t=>{const x=new Date(t.at);return x>=d&&x<next&&!t.sys});
    return {key,label:labels[d.getDay()],count:rows.length};});
}

  }

function csvCells(line){let out=[],s="",q=false;for(let i=0;i<line.length;i++){const c=line[i];if(c==='"'&&line[i+1]==='"'){s+='"';i++;}else if(c==='"')q=!q;else if(c===','&&!q){out.push(s.trim());s="";}else s+=c;}out.push(s.trim());return out;}
function parseLeadImport(raw){
  raw=raw.trim();if(!raw)return[];if(raw[0]==='['||raw[0]==='{'){const x=JSON.parse(raw);return Array.isArray(x)?x:(x.prospects||x.leads||[]);}
  const lines=raw.split(/\r?\n/).filter(Boolean),heads=csvCells(lines.shift()).map(x=>x.toLowerCase().replace(/[^a-z0-9]+/g,""));
  return lines.map(line=>Object.fromEntries(csvCells(line).map((v,i)=>[heads[i],v])));
}

}

const CAL_COL={shoot:T.gold,due:T.red,update:"#22d3b0",gcal:T.muted};
const CAL_LAB={shoot:"SHOOT",due:"DUE",update:"UPDATE",gcal:""};
function calItems(iso){
  const out=[];
  projects.forEach(p=>{ if(p.startISO===iso) out.push({k:"shoot",t:p.title,id:p.id}); });
  projects.forEach(p=>{ if(p.dueISO===iso&&pct(p)<100) out.push({k:"due",t:p.title,id:p.id}); });
  clients.forEach(c=>{ if(c.nextShootBy===iso) out.push({k:"update",t:c.name,cid:c.id}); });
  gcalOn(iso).forEach(e=>out.push({k:"gcal",t:e.title}));
  return out;
}
function calCell(dt){
  const iso=localISO(dt), today=iso===localISO(new Date());
  const dow=["Sun","Mon","Tue","Wed","Thu","Fri","Sat"][dt.getDay()];
  const chip=it=>{
    const c=CAL_COL[it.k]||T.muted, pre=CAL_LAB[it.k]?`<b>${CAL_LAB[it.k]}</b> `:"";
    const attr=it.id?`data-open="${esc(it.id)}"`:it.cid?`data-form="client" data-id="${esc(it.cid)}"`:"";
    return `<div class="cal-chip" ${attr} style="color:${c};border-color:${c}55;background:${c}12">${pre}${esc(it.t)}</div>`;
  };
  const items=calItems(iso);
  return `<div class="cal-cell ${today?"today":""}">
    <div class="cal-dow"><span>${dow}</span><span class="cal-day">${dt.getDate()}</span></div>
    ${items.length?items.map(chip).join(""):`<div class="cal-empty"></div>`}</div>`;
}

/* ── accounts receivable: everything a client still owes you ── */
function arItems(){
  const out=[];
  projects.forEach(p=>{
    const h=halfOf(p), price=+p.cost||0;
    if(price){
      if(!p.depositPaid) out.push({clientId:p.clientId,label:`${p.title} — deposit`,amount:h,due:p.dueISO,kind:"project"});
      if(!p.finalPaid)   out.push({clientId:p.clientId,label:`${p.title} — final`,amount:price-h,due:p.dueISO,kind:"project"});
    }
    addonsOf(p).forEach(a=>{ if(!a.paid) out.push({clientId:p.clientId,label:`${p.title} — ${a.label||"add-on"}`,amount:+a.amount||0,kind:"addon"}); });
  });
  invoices.filter(i=>i.status!=="Paid").forEach(i=>out.push({clientId:i.clientId,label:i.label||"Invoice",amount:+i.amount||0,due:i.dueISO,pay:i.pay,kind:"invoice"}));
  return out.filter(x=>x.amount>0);
}
function arByClient(){
  const map=new Map();
  arItems().forEach(it=>{
    const g=map.get(it.clientId)||{clientId:it.clientId,items:[],total:0,pay:null};
    g.items.push(it); g.total+=it.amount; if(it.pay&&!g.pay) g.pay=it.pay;
    map.set(it.clientId,g);
  });
  return [...map.values()].sort((a,b)=>b.total-a.total);
}
const arTotal=()=>arItems().reduce((s,x)=>s+x.amount,0);
/* best phone we have: SMS settings first, else the client's Contact field if it looks like a number */
const arPhone=c=>{
  const s=clientPhone(c.id); if(s) return s.replace(/[^\d+]/g,"");
  const ct=(c.contact||"").trim(); if(!ct||/@/.test(ct)) return null;
  const d=ct.replace(/[^\d+]/g,""); return d.replace(/\D/g,"").length>=10?d:null;
};
function reminderMsg(c,total){
  const first=(c.name||"there").trim().split(/\s+/)[0];

/* opens the phone's Messages app with the reminder pre-written — works before Twilio is set up */
const smsHref=(num,body)=>{

function fmtDateTime(ms){
  if(!ms) return "";
  const d=new Date(ms);
  return d.toLocaleDateString(undefined,{month:"short",day:"numeric"})+" at "+
         d.toLocaleTimeString(undefined,{hour:"numeric",minute:"2-digit"});
}
const monthName=()=>new Date().toLocaleDateString(undefined,{month:"long"});
function downloadFile(filename,text,type){
  const blob=new Blob([text],{type:type||"text/plain;charset=utf-8"});
  const url=URL.createObjectURL(blob);
  const a=document.createElement("a"); a.href=url; a.download=filename;
  document.body.appendChild(a); a.click();
  setTimeout(()=>{ URL.revokeObjectURL(url); a.remove(); },150);
}

  const summary={
    exportedAt:new Date().toISOString(), month:ym, by:me?.email||"",
    collectedThisMonth:collectedMonth(ym),
    billedThisMonth:payments().filter(x=>(x.when||"").startsWith(ym)).reduce((s,x)=>s+x.amount,0),
    monthlyRetainerValue:monthlyRetainerTotal(),

async function callFn(name,payload){

}
function loadPlaid(){ return new Promise((res,rej)=>{
  if(window.Plaid) return res();
  const s=document.createElement("script");
  s.src="https://cdn.plaid.com/link/v2/stable/link-initialize.js";
  s.onload=()=>res(); s.onerror=()=>rej(new Error("plaid")); document.head.appendChild(s);

async function linkBank(){
  try{

      onSuccess:async(pt,meta)=>{ toast("Linking…");

             toast("Linked — pulling transactions"); }catch(e){ errorLog(e,"plaidExchange"); toast("Couldn't save the link"); } },

const txnRuleFor=t=>{ const r=byId(txnRules,merchantKey(t)); return r?r.bucket:null; };
function txnBucket(t){
  if(t.bucket) return t.bucket;                 /* manual override on this txn */
  const r=txnRuleFor(t); if(r) return r;        /* remembered per-merchant */
  if((+t.amount||0)<0) return "income";         /* Plaid: negative = money in */
  const a=byId(bankAccounts,t.account_id);
  return (a&&a.bucket)||"personal";             /* else the account's default */
}

function ownerView(){
  const open=projects.filter(p=>pct(p)<100);
  const thisMonth=new Date().toISOString().slice(0,7);
  const lastMonth=(()=>{const d=new Date();d.setMonth(d.getMonth()-1);return d.toISOString().slice(0,7);})();
  const sumMonth=m=>invoices.filter(i=>(i.dateISO||"").startsWith(m)).reduce((s,i)=>s+(+i.amount||0),0);
  const outstInv=invoices.filter(i=>i.status!=="Paid").reduce((s,i)=>s+(+i.amount||0),0);
  const apOwed=payables.filter(p=>p.status==="owed").reduce((s,p)=>s+(+p.amount||0),0);
  const onDel=open.reduce((s,p)=>s+editTotal(p),0);
  const risk=projects.filter(p=>p.editStart&&p.stage>=2&&pct(p)<100&&daysIn(p.editStart)>=5).length;
  const projDue=projects.reduce((s,p)=>s+projOutstanding(p),0);
  const outst=outstInv+projDue;
  const pays=payments();

  if(!clients.length){

    const d=dleft(p), c=d<0?T.red:d<=3?T.gold:T.muted;

  const sorted=[...open].sort((a,b)=>dleft(a)-dleft(b));
  const radar=sorted.length?sorted.map(radarRow).join("")

  const edPay=editorNames().map(ed=>{

    const row=(label,meta,amt,tag,id)=>`<div class="list-row">

      <span class="amount">${money(amt)}</span>${tag}</div></div>`;
    return `<div style="margin-bottom:16px">
      <div style="display:flex;justify-content:space-between;align-items:baseline;margin-bottom:4px">
        <span style="font-size:14px;font-weight:800">${esc(ed)}</span>

      ${owedRows.map(p=>row(p.ref||"—","delivered — payment due",p.amount,`<span class="tag due-t" style="color:${T.red};border-color:${T.red}44;background:${T.red}14">OWED</span>`,p.id)).join("")}
      ${upcoming.map(p=>row(p.title,
        `${pct(p)}% · due ${p.due||""}${hasPieceCosts(p)?` · ${piecesFor(p,ed).length} of ${(p.pieces||[]).length} deliverables`:""}`,
        editCostFor(p,ed),`<span class="tag due-t">ON DELIVERY</span>`,null)).join("")}
      ${paidRows.map(p=>row(p.ref||"—",`paid ${p.paidOn||""}`,p.amount,`<span class="tag paid">PAID</span>`,p.id)).join("")}
    </div>`;}).join("");

  const stat=(l,v,c)=>`<div class="stat"><div class="l">${l}</div><div class="v" style="color:${c||"var(--cream)"}">${v}</div></div>`;

    ${stat("MONTHLY RETAINERS",money(monthlyRetainerTotal()),monthlyRetainerTotal()?T.gold:T.dim)}
    ${stat("COLLECTED THIS MONTH",money(collectedMonth(thisMonth)),T.green)}

        <div class="v" style="color:${outst?T.gold:T.green}">${money(outst)}</div>

  ${calendarStrip()}
  ${updateShootsPanel()}

  ${projectBoard()}
  <div class="two-col">
    <section class="panel"><div class="eyebrow">Delivery Radar</div>${radar}</section>
    <section class="panel"><div class="eyebrow">Editor Payments
      <span class="spacer"></span><button class="btn outline mini" data-form="payable">+ LOG PAYMENT</button></div>
      ${edPay||`<div style="font-size:13px;color:var(--dim)">No editors yet — add one under Access below.</div>`}
      <div class="list-row" style="border-top:1px solid rgba(232,181,66,.27)">
        <span style="font-family:var(--mono);font-size:11px;color:var(--gold-soft);letter-spacing:.1em">OWED NOW + ON DELIVERY</span>
        <span class="amount" style="color:var(--gold);font-weight:600">${money(apOwed+onDel)}</span></div>
    </section>
  </div>

  <section class="panel"><div class="eyebrow">Retainers Held
    <span class="spacer"></span>
    <span style="font-family:var(--mono);font-size:11px;color:var(--gold)">${money(monthlyRetainerTotal())} / MO · ${money(monthlyRetainerTotal()*12)} / YR</span></div>
    ${retainerClients().length?retainerClients()
      .sort((a,b)=>{ const ai=isActiveRetainer(a)?0:1, bi=isActiveRetainer(b)?0:1;
        return ai-bi || retainerValue(b)-retainerValue(a); }).map(c=>{
        const items=(c.retainerItems||[]).filter(x=>x.name);
        const active=isActiveRetainer(c), since=retainerSince(c);

        return `<div class="list-row" style="${active?"":"opacity:.62"}">
        <div><div class="inv-label">${esc(c.name)}${c.company?` <span style="color:var(--dim);font-weight:400">· ${esc(c.company)}</span>`:""}
          <span class="ret-tag ${active?"on":"off"}">${active?"ACTIVE":"INACTIVE"}${since?` · since ${esc(isoShort(since))}`:""}</span></div>
          <div class="inv-meta">${items.length?items.map(x=>esc(x.name)+(x.qty?` (${esc(x.qty)})`:"")).join(" · "):"no line items set"}${c.retainerDay?` &middot; bills the ${c.retainerDay}`:""}</div></div>
        <div style="display:flex;align-items:center;gap:8px">

          <span class="amount" style="color:${active?"var(--gold)":"var(--dim)"}">${money(retainerValue(c))}<span style="font-size:10px;color:var(--dim)">/mo</span></span>
          <button class="btn ghost mini" data-form="client" data-id="${esc(c.id)}">EDIT</button></div></div>`;}).join("")
      +`<div class="list-row" style="border-top:1px solid rgba(232,181,66,.27)">
        <span style="font-family:var(--mono);font-size:11px;color:var(--gold-soft);letter-spacing:.1em">TOTAL HELD PER MONTH — ${activeRetainerClients().length} ACTIVE${(retainerClients().length-activeRetainerClients().length)?` · ${retainerClients().length-activeRetainerClients().length} INACTIVE`:""}</span>
        <span class="amount" style="color:var(--gold);font-weight:600;font-size:16px">${money(monthlyRetainerTotal())}</span></div>`

  </section>

  ${revs.length?`<section class="panel"><div class="eyebrow" style="color:var(--red)">Client Revisions Requested — ${revs.length}</div>

      <div class="inv-meta">${esc(clientName(p.clientId))}${p.revisionNote?` &middot; &ldquo;${esc(p.revisionNote)}&rdquo;`:""}</div></div>

  </section>`:""}

  <section class="panel"><div class="eyebrow">Business Data &amp; Month-End

/* ══════════ STUDIO INVENTORY — insurance schedule ══════════
   The 43-item starter list lives in code (INVENTORY_SEED) and ALWAYS
   renders, with zero Firebase dependency. The `inventory` collection
   only stores changes layered on top:
     • an edit to a starter item  → a doc carrying that item's `sku`
     • a brand-new item you add    → a doc with no `sku`
     • a starter item you delete   → a doc {sku, deleted:true} (tombstone)
   So even if Firestore rules block the collection, you still see all 43. */
const invSlug=s=>String(s||"").toLowerCase().replace(/[^a-z0-9]+/g,"-").replace(/(^-|-$)/g,"");
const invLineTotal=it=>(+it.qty||0)*(+it.value||0);

/* Merge the built-in seed list with any Firebase overrides / additions. */
function inventoryAll(){
  const seed=INVENTORY_SEED.map((it,i)=>({...it,serial:"",notes:"",sku:invSlug(it.name),_seed:true,_ord:i,ref:"seed:"+invSlug(it.name)}));
  const bySku={}; seed.forEach((it,i)=>bySku[it.sku]=i);
  const tomb=new Set(); const extras=[];
  (inventory||[]).forEach(fb=>{
    const sku=fb.sku||invSlug(fb.name);
    if(fb.deleted){ if(fb.sku) tomb.add(fb.sku); return; }
    const i=bySku[sku];
    if(i!=null){ seed[i]={...seed[i],...fb,sku,_id:fb.id,_seed:true,ref:"id:"+fb.id,_ord:seed[i]._ord}; }
    else { extras.push({...fb,_id:fb.id,ref:"id:"+fb.id,_ord:9999}); }
  });
  return seed.filter(it=>!tomb.has(it.sku)).concat(extras);
}
const invByRef=ref=>inventoryAll().find(x=>x.ref===ref)||null;
const invGrand=()=>inventoryAll().reduce((s,it)=>s+invLineTotal(it),0);
const invUnits=()=>inventoryAll().reduce((s,it)=>s+(+it.qty||0),0);
const invCategories=()=>{
  const set=new Set(inventoryAll().map(it=>it.category||"Other"));
  const known=INV_CATEGORIES.filter(c=>set.has(c));
  const extra=[...set].filter(c=>!INV_CATEGORIES.includes(c)).sort();
  return [...known,...extra];
};

  return `${backBar("Studio Inventory")}

      ${subStat("TOTAL VALUE",money(invGrand()),T.gold)}

async function saveInvItem(ref){
  const name=fv("iv-name"); if(!name) return toast("Item name required");
  const data={
    name,
    category:fv("iv-cat")||"Other",
    qty:Math.max(0,+fv("iv-qty")||0),
    value:Math.max(0,+fv("iv-val")||0),
    serial:fv("iv-serial"),
    notes:fv("iv-notes")
  };
  await guard(async()=>{
    if(ref&&ref.startsWith("id:")){ await updateDoc(doc(db,"inventory",ref.slice(3)),data); }
    else if(ref&&ref.startsWith("seed:")){ await addDoc(collection(db,"inventory"),{...data,sku:ref.slice(5)}); }

  },ref?"Item updated":"Item added");

async function removeInvItem(ref){
  const it=invByRef(ref);
  if(!confirm(`Delete ${it?it.name:"this item"} from the inventory?`)) return;
  await guard(async()=>{
    if(ref.startsWith("seed:")){ await addDoc(collection(db,"inventory"),{sku:ref.slice(5),name:it?it.name:"",deleted:true}); }
    else if(ref.startsWith("id:")){
      const id=ref.slice(3), d=byId(inventory,id);
      if(d&&(d.sku||invSlug(d.name)&&INVENTORY_SEED.some(s=>invSlug(s.name)===(d.sku||invSlug(d.name))))){
        await updateDoc(doc(db,"inventory",id),{deleted:true,sku:d.sku||invSlug(d.name)});
      } else { await deleteDoc(doc(db,"inventory",id)); }
    }
  },"Item removed");
  closeModal();
}
function exportInventoryCSV(){
  const esc2=v=>{ v=String(v??""); return /[",\n]/.test(v)?`"${v.replace(/"/g,'""')}"`:v; };
  const lines=[];
  lines.push("Under The Sun Studios — Studio Inventory (Current Replacement Value)");
  lines.push(`Exported,${new Date().toLocaleString()}`);
  lines.push("");
  lines.push(["Category","Item","Qty","Value Each","Line Total","Serial #","Notes"].join(","));
  const all=inventoryAll();
  invCategories().forEach(cat=>{
    all.filter(it=>(it.category||"Other")===cat)
       .sort((a,b)=>(a._ord-b._ord)||(a.name||"").localeCompare(b.name||""))
       .forEach(it=>lines.push([cat,it.name,+it.qty||0,+it.value||0,invLineTotal(it),it.serial||"",it.notes||""].map(esc2).join(",")));
    const sub=all.filter(it=>(it.category||"Other")===cat).reduce((s,it)=>s+invLineTotal(it),0);
    lines.push(["",`${cat} subtotal`,"","",sub,"",""].map(esc2).join(","));
  });
  lines.push("");
  lines.push(["","GRAND TOTAL","","",invGrand(),"",""].map(esc2).join(","));
  downloadFile(`uts-inventory-${new Date().toISOString().slice(0,10)}.csv`,lines.join("\n"),"text/csv;charset=utf-8");
  toast("Inventory exported");
}

    return esc(str.slice(0,idx))+`<mark class="drive-match">${esc(str.slice(idx,idx+q.length))}</mark>`+esc(str.slice(idx+q.length));

        ${filtered.length?filtered.map(p=>`<div class="drive-projrow">
          <div style="min-width:0"><div class="dp-t">${hl(p.title)}</div>

/* FCP7 rate: NTSC rates 23.976/29.97/59.94 use timebase 24/30/60 + ntsc TRUE; whole rates ntsc FALSE */
function fsRate(fps){ fps=+fps||24; const ntsc=[23.976,29.97,59.94].includes(fps);
  const tb= fps===23.976?24: fps===29.97?30: fps===59.94?60: Math.round(fps);
  return {tb, ntsc, xml:`<rate><timebase>${tb}</timebase><ntsc>${ntsc?"TRUE":"FALSE"}</ntsc></rate>`}; }
